[package]
name = "gse-next"
version = "0.1.37"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# ⚠️★★★ **実効 MSRV** —— ★ 2026-09-12 に **ビルドで実証**した (R-3)。
#
#   ⚠️★★★ **旧宣言 `1.87` は誤りだった。** ★ 旧根拠はローカル `rust-src` の
#     `#[stable(since = ...)]` (`u64::is_multiple_of` = 1.87.0 / `Option::is_none_or` = 1.82.0 /
#     `iter::repeat_n` = 1.82.0 / `u64::abs_diff` = 1.60.0) だけで、
#     ⚠️ **依存 crate 自身が宣言する `rust-version` を見ていなかった**。
#
#   ★ 実測 (`cd src-tauri && cargo +1.87 check --all-targets --features package`):
#     ```
#     error: rustc 1.87.0 is not supported by the following packages:
#       time@0.3.47 / time-core@0.1.8 / time-macros@0.2.27 requires rustc 1.88.0
#     ```
#   ★ 実測 (`cargo +1.88 check --all-targets --features package`): **exit 0** (4m58s)。
#   ★ 依存グラフ全体の走査 (`cargo metadata --all-features` の `rust_version`・424/630 crate が宣言)
#     でも **最大要求は 1.88.0** (`time` 系 3 本) であることを確認した。
#
#   ⚠️★★★ **現在の拘束元は自コードではなく `Cargo.lock` の `time` 系である。**
#     ★ 自コードの std API 下限は **1.87** のまま (`is_multiple_of`)。
#     → ⚠️ `time` が依存グラフから外れる / 版が下がると、**この宣言だけが過剰に厳しく残る**。
#     ★ 依存を動かしたら `docs/verification-runbook.md` §1 (f) の MSRV 検査を回し直すこと。
#
#   ⚠️★★ **実証の範囲は「Windows の cfg 集合」に限られる** —— ★ 実測は Windows 実機で行っており、
#     `hook_macos.rs` / `observe_macos.rs` / `ime_macos.rs` は **1 行もコンパイルされていない**
#     (`docs/agent-shared.md`「手元の検証は CI の代替にならない」)。
#     ★ ただし ⚠️ **依存側については留保は不要** —— mac 専用 crate (`core-graphics` / `cocoa` /
#     `objc2` = 1.71 / `block2` = 1.71) も `--all-features` の**同じグラフに入っており**、
#     要求はいずれも 1.88 未満であることを確認済み。
#     → ★ **残る未検証は「GSE 自身の mac ソースが使う std API」だけ**である。
#   ⚠️ **MSRV を継続検査する CI job は無い** (研究者裁定: 足さない)。
#     → ★ 新しい std API / 依存を入れたときに自動では気付かない。手で回すこと。
#
#   ★ `edition = "2021"` は resolver "2" なので、**この宣言が依存解決を変えることはない**
#     (⚠️ MSRV 対応 resolver は "3" から)。⚠️ ただし **依存側の宣言は別物**で、
#     上のとおり cargo が**ハードエラー**にする (★ 旧注記はここを取り違えていた)。
rust-version = "1.88"
# `cargo run` / `cargo tauri dev` で本体 Tauri アプリを起動させる。
# `src/bin/replay.rs` の `gse-replay` と曖昧になるため明示が必須。
default-run = "gse-next"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Phase 0 P0-4: セッションリプレイ CLI。NDJSON を入力に analysis::loop_step::step
# を再実行し FeatSnapshot 列を生成する。ゴールデンスナップショット回帰保護と
# GT 評価の共通基盤（原則 A: Replay-as-Truth）。
[[bin]]
name = "gse-replay"
path = "src/bin/replay.rs"

# Task E: 被験者横断 (cohort) 較正判定 CLI。gse-replay --calibration が出力した
# per-被験者 calibration レポート JSON を gse-dataset ツリーから集約し、凍結純関数
# model_gate/measurement_gate を再利用してコホート Go/Kill/INCONCLUSIVE を判定する。
[[bin]]
name = "gse-cohort"
path = "src/bin/cohort.rs"

# transfer-pipeline: 被験者端末で raw NDJSON を匿名化 (VK→KeyCategory・時刻相対化) し、
# 研究者の age 公開鍵宛に暗号化して P###_<date>.age を出力する自己完結 CLI (D6 / WBS 0.15)。
# `age` 依存を default の Tauri ビルドに載せないため required-features で隔離する
# (cargo build --features package --bin gse-package で生成)。
[[bin]]
name = "gse-package"
path = "src/bin/package.rs"
required-features = ["package"]

# pilot-pipeline-runbook (D-PP1): 研究者端末で受領した P###_<session>.age を age 復号し
# 匿名化 NDJSON を取り出す自己完結 CLI (gse-package の鏡像)。`--keygen` で鍵ペア生成も担う。
# gse-package と同じ `package` feature gate で age 依存を default ビルドから隔離する
# (cargo build --features package --bin gse-unpack で生成)。
[[bin]]
name = "gse-unpack"
path = "src/bin/unpack.rs"
required-features = ["package"]

# M0 凍結 (T2 / decisions D3): 被験者が最新セッションを自動検出して匿名化+暗号化する
# ダブルクリック提出ツール。gse-package のパス手打ちを排除する。匿名化+crypto は packaging
# module で gse-package と単一情報源。同じ `package` feature gate で age 依存を隔離する
# (cargo build --features package --bin gse-submit で生成)。
[[bin]]
name = "gse-submit"
path = "src/bin/submit.rs"
required-features = ["package"]

[features]
# gse-package / gse-submit bin 専用。age 暗号化と **HTTP 送信** を有効化する。
# ⚠️ ★ default ビルド (盲検 Tauri アプリ) には載らない。G1 の自動提出は
# `gse-submit --reconcile` (別プロセス) が行うので、★ **アプリ本体に age も HTTP も載せない**
# (decisions D3 の隔離方針を維持し、Tauri CSP を 1 文字も触らずに済む)。
package = ["dep:age", "dep:reqwest"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gse_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
# Phase 1: Ground Truth ラベリング用のグローバルホットキー
# (Cmd/Ctrl+Shift+Alt+F/I/S → record_user_label)
tauri-plugin-global-shortcut = "2"
# G1: 二重起動の検出。★ 2026-08-05 の実測で「同じ bundle ID でもパスが違えば 2 プロセスが
# 共存し、NDJSON が 2 本に割れる」ことを確認したため必要になった
# (.steering/20260805-g1-app-mode-and-log-rotation/decisions.md R-7)。
# ⚠️ 公式文書の指示どおり **最初に登録する**こと。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: gse-replay のゴールデンスナップショットで f64 の
# JSON → parse → JSON のラウンドトリップを bit-equal に保証するため有効化。
# 無効だとデシリアル時に数 ULP のドリフトが入り snapshot 比較が落ちる。
serde_json = { version = "1", features = ["float_roundtrip"] }
# Phase 1 dataset-repo-setup: Rust 型から JSON Schema を機械生成し、
# gse-dataset 側の schema と drift しないよう CI で検知するために使用。
# bin `emit_schema` 専用。production path (logger.rs 本体) は触らない。
schemars = "0.8"

# Wall Server: QRコードによるスマートフォン連携Wall解除
base64 = "0.22"

# envelope-issues (起票 2): `gse-replay --features` の封筒 `provenance.source_sha256`。
# 「どのセッション NDJSON から出た行か」を、ファイル名が変わっても同定できるようにする。
# ★ **新規の供給元を増やさない**: `sha2 0.10.9` は既に `wry` (tauri の実行時依存) と
# `tauri-codegen` (ビルド依存) 経由でビルドツリーに入っている (Cargo.lock 実測)。
# `reqwest` を足したときと同じ論拠 (rust-standards ルール 7「既存の依存で代替できないか」)。
sha2 = "0.10"

# Utilities
crossbeam-channel = "0.5"
# capture-schema-freeze (CD1): ペースト時にクリップボードの**文字数のみ**を取得するため
# (external_paste_chars / (b) manual_contribution_ratio)。中身は数えて即破棄し保存・送信しない。
# 両 OS の clipboard API (Win32 / NSPasteboard) を安全に抽象化し、unsafe を自前で書かないため採用。
# OS 依存は input/clipboard.rs に隔離する (architecture-rules: OS API は input/ に閉じる)。
# default-features = false で `image-data` を無効化し、画像デコーダ (`image` crate 等) を
# 推移依存から外す。本用途は get_text() のみで画像機能は不要 (攻撃面・ビルド時間の削減)。
arboard = { version = "3", default-features = false }
# Task B: ランダム時点プローブの一様ランダム時刻生成 (analysis/probe_scheduler.rs)。
# StdRng を seed 注入して決定論テスト可能にする。lock に 0.8.5 が既存。
rand = "0.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
# transfer-pipeline (feature "package" / bin gse-package 専用・optional): 匿名化 NDJSON を
# 研究者 X25519 公開鍵宛に age 暗号化する。default の Tauri ビルドには載らない (RAM/サイズ抑制)。
age = { version = "0.10", optional = true }
# G1 自動提出 (feature "package" / bin gse-submit 専用・optional): 生成した `.age` を
# GAS Web App へ POST する。★ `tauri` が既に依存しているクレートなので**新規の供給元を増やさない**。
# ⚠️ ★ 実測 (gas-measurements.md M-1): GAS の POST は **302 を返す**ので
# **リダイレクト追従が必須**。reqwest の既定方針は 302 で POST → GET に変える (curl 既定と同じ) ため、
# 実測で 200 が返った形と一致する。★ メソッドを強制すると **405** になる。
# `rustls` feature は `rustls-platform-verifier` 経由で OS の信頼ストアを使う (Win/mac 両対応)。
reqwest = { version = "0.13", optional = true, default-features = false, features = [
    "blocking",
    "rustls",
    "charset",
    "http2",
    "system-proxy",
] }

# --- Platform-specific dependencies ---

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # ⚠️★★★ O1 (R3-a): Raw Input (`RIDEV_INPUTSINK` + `GetRawInputBuffer`・マウスのみ)。
    #   ★ `WH_MOUSE_LL` は採らない (ADR-014 D4: 入力を直列化し通知なく外される)。
    "Win32_UI_Input",
    "Win32_UI_Input_Ime",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Variant",
    # ★ `DwmGetWindowAttribute(DWMWA_CLOAKED)` —— IME 候補 UI は `ShowWindow` ではなく
    #   DWM の cloak/uncloak で表示制御されるため、**現在 cloak されているか**を
    #   OS に直接聞くのに使う (`.steering/20260823-ime-active-cloak-rewiring/`)。
    "Win32_Graphics_Dwm",
    # ⚠️ O1 (R3-a): `WNDCLASSW` は `HBRUSH`/`HICON`/`HCURSOR` を持つため GDI 側に置かれている。
    #   ★ メッセージ専用ウィンドウ (Raw Input の `hwndTarget`) を作るのに要る。
    "Win32_Graphics_Gdi",
] }
lazy_static = "1.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
# O1 L-c フォーカス遷移 (`NSWorkspace.didActivateApplicationNotification`) 用。
# Cocoa/AppKit API は Carbon の `#[link] extern "C"` パターン (ime_macos.rs/hook_macos.rs)
# では書けない (C シムが無い)。バージョンは Tauri の macOS バックエンド (tao/wry) が既に
# 推移依存として Cargo.lock に解決しているものに合わせ、新たな解決リスクを増やさない。
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
# overlay 窓を非アクティブ NSPanel 化し、フォーカスを奪わずクリックを webview へ配送する
# (透明 overlay 窓のクリック無反応の真因対処。decisions D7)。crates.io 未掲載のため git 固定。
# v2 ブランチ = 既存窓を `WebviewWindowExt::to_panel()` で変換する API。
# rev 固定: ブランチ追従だと `cargo update` でレビューなしに HEAD へ滑る (サプライチェーン)。
# 更新は意図的なレビュー対象にするため明示 rev で pin する (v2 branch の検証済みコミット)。
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1a" }

# Reduce debug build artifact size to avoid filling disk.
# debug=1 keeps line-number tables (enough for panic backtraces) but omits
# per-variable DWARF info.  Runtime performance is completely unaffected.
# This typically cuts target/debug/ from ~7GB down to ~3GB.
[profile.dev]
debug = 0              # No debug symbols → linker uses ~60% less RAM (LNK1102 fix)
split-debuginfo = "unpacked"
codegen-units = 1      # Single codegen unit: reduces peak per-crate RAM at cost of speed

# Heavy Tauri transitive dependencies: compile with minimal settings to reduce RAM.
# icu_properties-2.x and windows-sys-0.61 are the primary OOM culprits.
[profile.dev.package."icu_properties"]
opt-level = 0
codegen-units = 1

[profile.dev.package."windows-sys"]
opt-level = 0
codegen-units = 1

[profile.dev.package."windows"]
opt-level = 0
codegen-units = 1
