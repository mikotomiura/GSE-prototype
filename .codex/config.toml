# Codex CLI configuration for this project
# Generated by /setup-codex-bridge (Phase 5)
# Policy (禁止事項 / 責務分担 / rescue 判断) は AGENTS.md が真実源。
# 設定値の矛盾時は AGENTS.md が優先。

# モデル設定 (真実源: ここ。AGENTS.md はコメントで参照のみ)
model = "gpt-6-sol"   # ★ 2026-09-25: gpt-5.5 は CLI 上で Legacy。既定と rescue は workhorse の sol、review / consult は scripts 側で gpt-6-astra を明示
model_reasoning_effort = "medium"

# サンドボックス既定 — read-only。書き込みが必要な時だけ Skill 側で workspace-write を明示
[sandbox]
default = "read-only"

# 承認モード — 全シェルコマンドを事前承認させる
[approval]
default = "untrusted"

# 出力上限
[output]
tokens_cap = 30000

# 関連ファイル
# .codex/budget.json — 日次トークン予算
# scripts/secrets-filter.sh — 機密 / proprietary フィルタ
# .claude/skills/codex-review/ — レビュー呼び出し Skill
# .claude/skills/codex-rescue/ — rescue 呼び出し Skill
# .claude/skills/codex-consult/ — 設計相談 Skill
