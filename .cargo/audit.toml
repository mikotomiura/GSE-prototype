# cargo-audit の設定 (F-1 / F-2・2026-09-12)。
#
# ★ 読まれ方: `cargo-audit audit --file src-tauri/Cargo.lock` を **repo 直下**から実行すると
#   このファイルが効く。⚠️ **実測値は 2 回ある** (★ h2 を直す前と後で違う):
#     - 除外を入れる前 (h2 未修正): **3 件 → 1 件**
#     - ★ **現在 (h2 0.4.19 の後): 2 件 → 0 件**
#   ⚠️ `src-tauri/` に降りて叩くとこのファイルは**読まれず** (★ cargo-audit は親を遡らない・実測)、
#   結果が食い違う。→ ★ 素の `cargo-audit` は **repo 直下から**回すこと。
#
# ⚠️★★★ **ただし `$CARGO_HOME/audit.toml` も効く** (★ 2026-09-12 に実測 —— 個人設定が
#   `quick-xml` の 2 件を**黙って消した**)。→ ★ `scripts/check_dependency_audit.py` は
#   sandbox の `CARGO_HOME` で回し、**どの設定も届かない**ことを実行後に検算する。
#
# ⚠️★★★ **このファイルに書いてよいのは `[advisories] ignore` だけである。**
#   ★ ラッパーは設定の無い sandbox で cargo-audit を回すので、`severity` /
#   `informational_warnings` / `[output] deny` / `[yanked] enabled` は
#   **ラッパー経由では無言で落ちる**のに素の実行では効く —— ⚠️ 1 つのファイルが
#   2 つの答えを出すのが最悪なので、**他のキーがあればラッパーは exit 4 で落ちる**。
#
# ⚠️★★★ **ここに ID を足すと、cargo-audit の出力からその advisory は跡形もなく消える。**
#   ★ 2026-09-12 に実測 (cargo-audit 0.22.2): 除外した 2 件は**件数すら出ない** ——
#   「緑」と「除外したから緑」が**出力上まったく区別できない**。
#   ⚠️ これは R-4 が `panic!` に倒した無音 skip と同じ失敗様式である。
#   → ★ **だから `scripts/check_dependency_audit.py` を通して回す**。
#     ★ 同 script は (a) 除外 ID を毎回必ず印字し、(b) **stale な除外**
#     (= もう報告されない ID がここに残っている) を **exit 2 で赤にする**。
#     ⚠️ `cargo-audit` 単体ではこの (b) ができない —— 何にも当たらない除外は
#     **見えないまま永久に残る**。
#
# ⚠️ **理由と再点検期日の無い除外は書かない。**
#
# ★ 足す前に必ず答えること:
#   1. **直せないのか** (⚠️ `cargo update -p <crate>` が解を持たないことを実測したか)
#   2. **どの経路に載るのか** (⚠️ `cargo tree -e normal --target all -i <crate>` で実測したか)
#   3. **被験者に届くのか** (★ 盲検 Tauri アプリ本体か / `--features package` の提出ツールか)
#   4. **いつ見直すのか** —— ⚠️★★★ **`# review-by: YYYY-MM-DD` を必ず同じ行に書く。**
#      ★ 無いとラッパーが **exit 4**、期日を過ぎると **exit 2** で落ちる。
#      ⚠️ stale 判定 (もう報告されない ID) だけでは、**上流が直さない限り永久に緑**になる ——
#      `quick-xml` はまさにその形なので、期日を機械に持たせる。

[advisories]
# ⚠️★★★ RUSTSEC-2026-0194 / RUSTSEC-2026-0195 —— `quick-xml 0.38.4`
#
# ★ 経路 (実測 2026-09-12・`cargo tree -e normal --target all -i quick-xml`):
#     quick-xml 0.38.4 <- plist 1.8.0 <- tauri 2.10.2 <- gse-next
#   ⚠️ **macOS 経路のみ** (Windows のターゲットツリーには現れない)。
#   ★ 盲検 Tauri アプリ本体に載る (⚠️ `--features package` 側ではない)。
#
# ⚠️ **直せない** (実測): 修正版は **0.41.0** で、`plist 1.8.0` が `0.38` 系を要求している。
#   → `cargo update -p quick-xml` は **`Locking 0 packages`** を返す (= semver 内に解が無い)。
#   ★ 上流 (tauri / plist) が上げるまで待つしかない。
#
# ★ 露出評価: 本 advisory は **未信頼 XML に対する二次関数的処理時間 (DoS)** である。
#   GSE が `plist` に渡すのは **自前バンドルの `Info.plist`** であって被験者入力ではない。
#   ⚠️ 「当たらない」と断定はしない —— ★ 到達しうる入力が増えたら評価をやり直すこと。
#
# ★ 再点検: **2026-12-12** まで (⚠️ それまでに tauri を上げたら真っ先にここを消して再実行する)。
#   ★ **期日は機械が読む** (下記 `# review-by:`) —— ⚠️ 過ぎたらラッパーが exit 2 で落ちる。
ignore = [
    "RUSTSEC-2026-0194",  # review-by: 2026-12-12
    "RUSTSEC-2026-0195",  # review-by: 2026-12-12
]
