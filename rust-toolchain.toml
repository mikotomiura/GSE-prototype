# ⚠️★★★ **toolchain の固定** (R-2・2026-09-12 に研究者裁定)。
#
# ★ なぜ固定するか:
#   1. 本 repo は `reproducibility-discipline` で **`Cargo.lock` / seed / `HMM_VERSION` を固定**
#      する規律を敷いている。⚠️ **toolchain だけ浮いているのは一貫していない。**
#   2. ⚠️★★★ 2026-09-12 に CI へ `cargo clippy ... -D warnings` のゲートが入った (R-1)。
#      → ★ stable に追従したままだと、**コード差分ゼロでも toolchain 更新日に main が
#      一斉に赤くなる**。⚠️ そのとき `-D warnings` を外して逃げてはならない
#      (★ 外した瞬間「見えないまま緑」へ戻る) ので、**不意打ちの側を止める**。
#   3. ★ 版上げは「別 PR で意図的に」になる —— ⚠️ これは `HMM_VERSION` bump と同じ作法である。
#
# ⚠️ 代償 (★ 承知のうえで採っている):
#   - rustc / std のセキュリティ修正に**自動追従しない**
#     (★ 依存の脆弱性は `Cargo.lock` 側の話なので、ここで守られるのは rustc / std 由来に限る)。
#   - ⚠️ ランナーに stable と本版の **2 本**が載る。★ 実測: toolchain 1 本 ≈ **1.3〜1.4 GiB**
#     (2026-09-12・Windows 実機)。⚠️ mac self-hosted はディスクガードが threshold=15 GiB で
#     実測の空きが 18〜20 GiB。→ ★ **threshold は割らないが余裕は確実に減る。**
#
# ★ `components` をここに書く理由: ⚠️ `dtolnay/rust-toolchain` は `--profile minimal` で入れるので
#   **clippy は既定で入らない**。★ ファイル側に書けば rustup が toolchain と**一緒に入れる**ので、
#   「lint が走らなかった」のか「lint が緑だった」のか分からない穴が**構造的に**閉じる。
#
# ⚠️ `targets` は**書かない** —— ★ 実測 (2026-09-12):
#   `matrix.target` は **両レグとも host と同一** (win=`x86_64-pc-windows-msvc` /
#   mac=`aarch64-apple-darwin`) であり、新規 toolchain には **host target の std が同梱**される
#   (`rustup target list --installed --toolchain 1.94.1` で確認)。
#   → ⚠️ ここに両方を書くと**相手 OS の std を両機に入れる**ことになり、ディスクを無駄に食う。
#
# ⚠️★★ **MSRV とは別物である。** ★ ここは「CI と手元が使う版」、
#   `src-tauri/Cargo.toml` の `rust-version` は「利用者に約束する下限」(2026-09-12 時点で **1.88**)。
#   ★ `cargo +<version>` は**このファイルを上書きする**ので、MSRV 検査は固定と両立する (実測済み)。
#
# ★ 版を上げるときの手順:
#   1. `channel` を書き換えた**単独 PR** を立てる (⚠️ 他の変更と混ぜない)。
#   2. `cargo clippy --all-targets --features package -- -D warnings` を**両 OS で**緑にする。
#   3. ゴールデン (`gse-replay --snapshot`) が byte-equal であることを確認する。
#   4. ⚠️ ランナーの古い toolchain を `rustup toolchain uninstall <old>` する (★ ディスク)。
[toolchain]
channel = "1.94.1"
components = ["clippy", "rustfmt"]
