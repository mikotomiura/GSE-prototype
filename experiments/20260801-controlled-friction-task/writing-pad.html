<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G1 記入パッド</title>
<!--
  G1 統制タスク実験 — 被験者の入力先（B-5 の解・研究者判断 2026-08-03）

  ★ このファイルは「被験者が 300〜400 字をどこに打つか」を **全被験者・全ブロックで固定する**
    ためのものである。実務の都合ではなく **統制** である:
      - bs_rate（訂正率）は FS-B の 14 特徴量の 1 つであり、オートコレクト・赤波線・自動補完が
        働くと修正行動が変わる。入力先が人ごと・ブロックごとに違えば、preregistration.md §2.2 が
        却下したはずの「機械的に打鍵を変える操作」を統制外で招き入れることになる。
      - したがって **入力先を 1 つに固定すること自体が要件**であり、
        どのエディタが優秀かという話ではない。

  ★ 設計上の約束（consent.md §3 / participant-guide.md §6 / protocol.md §7 の content-free 原則）
      1. 本文を **保存しない**。localStorage / sessionStorage / IndexedDB / Cookie を使わない。
      2. 本文を **どこにも送らない**。fetch / XHR / WebSocket / <form> / 外部リソースを一切持たない。
      3. 記録するのは **文字数だけ**（画面に出すだけで、ファイルにも書かない）。
      4. 依存ゼロ・単一ファイル。オフラインで開ける。

  ★ 文字数の数え方は validate_materials.py の count_chars と **同じ規則**に揃えてある:
      空白・改行・制御文字（Unicode カテゴリ C）を数えない。コードポイント単位。
      → 資料の文字数（§2.2 の ±5% 制約）と産出文字数（§3.5 の報告義務）が同じ物差しになる。

  ⚠️ 開き方は protocol.md §1.2 に従うこと（拡張機能なしのプロファイルで開く）。
     Grammarly 等の拡張は data-gramm 属性で抑止を試みるが、**抑止できない拡張もある**。
-->
<style>
  /* ★ OS 差・テーマ差を持ち込まないため、配色とフォント指定を固定する（見た目も統制対象）。 */
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #f5f5f4; color: #1c1917;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    font-size: 16px; line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .block-no { font-size: 14px; }
  .block-no input {
    width: 4em; font-size: 14px; padding: 2px 6px;
    border: 1px solid #a8a29e; border-radius: 4px; background: #fff;
  }
  textarea {
    width: 100%; height: 58vh; min-height: 280px; padding: 16px;
    font-family: inherit; font-size: 17px; line-height: 1.9;
    color: inherit; background: #fff;
    border: 1px solid #a8a29e; border-radius: 6px; resize: none;
  }
  textarea:focus { outline: 2px solid #0f766e; outline-offset: 1px; }
  footer {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    margin-top: 12px; font-size: 15px;
  }
  #count { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hint { color: #57534e; font-size: 13px; }
  button {
    font: inherit; font-size: 14px; padding: 6px 14px;
    border: 1px solid #a8a29e; border-radius: 6px; background: #fff; cursor: pointer;
  }
  button:hover { background: #e7e5e4; }
  .notice {
    margin-top: 14px; padding: 10px 14px; font-size: 13px; line-height: 1.7;
    background: #fff7ed; border: 1px solid #fdba74; border-radius: 6px; color: #7c2d12;
  }

  /* ★★ 5 分の終了通知（2026-08-05 追加）。
       ⚠️ **残り時間は出さない。** protocol.md §4.4 は「残り時間のアナウンスをしない」と定め、
          その理由は「時間の切迫を作る操作は採らない」と決めてあるためである。
          → ★ 出すのは**終わったという 1 つの事実**だけにする。
       ★ 既定は非表示。5 分たったときだけ現れる。 */
  #timesup { display: none; }
  /* ⚠️ ★ **レイアウトを 1px も動かさない**（2026-08-05・実測で踏んだ）。
       通常フローに置くと、その高さぶんだけ下が押し下げられ、
       **文字数の表示が画面外へ出た**（734x750 で footer の下端が 757px になった）。
       ★ 知らせが出るのは「文字数を控えてください」と言う場面そのものなので、
         それを隠すのは最悪の壊れ方である。→ position: fixed で層を分ける。 */
  body.g1-over #timesup {
    display: block;
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 12px 16px;
    font-size: 17px; font-weight: 700; text-align: center;
    background: #7f1d1d; color: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
  }
  /* ★ 終了後は記入欄が読み取り専用になる。見た目でもそれが分かるようにする
       （⚠️ 本文は消さない。文字数を控えるまで画面に残す必要がある）。 */
  body.g1-over textarea { background: #f5f5f4; color: #57534e; }
  /* ★ 消去ボタンの 2 段階目（P-1 で「押しても次へ行かない」ラベルを直したのと同じ趣旨で、
       押した結果が取り返しのつかないものは、押す前に分かるようにする）。 */
  button.arm { background: #7f1d1d; color: #fff; border-color: #7f1d1d; }
  button.arm:hover { background: #991b1b; }

  /* ★ 課題文パネル（build_task_pages.py が差し込む。単体で開いたときは存在しない） */
  .task {
    margin-bottom: 16px; padding: 16px 20px;
    background: #fff; border: 1px solid #a8a29e; border-radius: 6px;
    max-height: 42vh; overflow-y: auto;
    /* ★★ コピーさせない。紙で配っていたときは物理的にペーストできず、
       preregistration.md §5.1 は「external_paste_chars は全ブロック 0」と宣言していた。
       画面提示に変えてもその前提を保つ。⚠️ これは**入力への介入ではない**
       （§2.11 は「パッドはペーストを禁止しない」= 被験者の打鍵挙動に手を出さない、という意味）。 */
    user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
  }
  .task h2 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  .task h3 { font-size: 14px; margin: 14px 0 4px; font-weight: 600; color: #44403c; }
  .task p { margin: 6px 0; }
  .task .fiction { font-size: 13px; color: #7c2d12; }
  /* ★ 生成版では textarea を少し低くして、課題文と記入欄が同時に見えるようにする */
  body.has-task textarea { height: 34vh; min-height: 200px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>G1 記入パッド</h1>
    <label class="block-no">ブロック <input id="block" type="text" inputmode="numeric"
      autocomplete="off" spellcheck="false" aria-label="ブロック番号"></label>
  </header>

  <!--G1_TASK_PANEL_SLOT-->

  <!--
    ★ 補完・自動修正を全部切る。ここが B-5 の本体である。
       autocorrect / autocapitalize は非標準だが Safari / iOS が見る。
       data-gramm* は Grammarly の慣習的なオプトアウト属性。
  -->
  <textarea id="pad"
    spellcheck="false"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    data-gramm="false"
    data-gramm_editor="false"
    data-enable-grammarly="false"
    aria-label="本文"></textarea>

  <div id="timesup" role="status" aria-live="polite">
    ★ 5 分たちました。ここで手を止めてください。
  </div>

  <footer>
    <span>文字数 <span id="count">0</span></span>
    <span class="hint">（空白・改行を数えません／目安 300〜400 字）</span>
    <!-- ⚠️ ★ ラベルは**このボタンが実際にすること**だけを書く（2026-08-05・P-1 で発覚）。
         旧ラベル「消去して次のブロックへ」は、押しても次のブロックへ行かないのに
         行くと約束していた。ページ遷移を足すのは**誤り**である:
           - protocol.md §1 D-1 = 1 ブロック 1 セッション。ブロック間には
             1 分休憩と launcher 経由のアプリ再起動が入る。
             ページが勝手に進むと、前ブロックの記録中に次を書き始められる。
           - preregistration.md §2.13 =「次のブロックのファイルを先に開かない」。
         → ★ 遷移させないのが正しい。**ラベルの側を実装に合わせる。** -->
    <button id="clear" type="button">本文を消去する</button>
  </footer>

  <p class="notice">
    ★ <strong>書いた文章は保存されません。</strong>
    このページを閉じる・再読み込みすると本文は消えます。記録するのは文字数だけです。<br>
    ★ <strong>このページを開いた時点で 5 分が始まります。</strong>
    先に開いて置いておかないでください。5 分たつと知らせが出て、記入欄は書けなくなります
    （⚠️ 本文は消えません。<strong>文字数を控えてから</strong>「本文を消去する」を押してください）。<br>
    ★ 次のブロックは<strong>このページからは始まりません</strong>。
    <strong>アプリを起動し直してから</strong>次の番号のページを開いて始めます。
  </p>
</div>

<script>
"use strict";
(function () {
  var pad = document.getElementById("pad");
  var out = document.getElementById("count");
  var clearBtn = document.getElementById("clear");

  // ★ build_task_pages.py が生成したブロックページでは window.G1_BLOCK が入っている。
  //   その場合、ブロック番号は**割付から決まっている**ので手入力させない
  //   （手入力はそこで取り違えが起きる。protocol.md §2.3「転記は 1 方向だけ」）。
  //   単体で開いたとき（従来どおりの記入パッド）は undefined で、入力欄のまま動く。
  var blockInput = document.getElementById("block");
  if (typeof window.G1_BLOCK !== "undefined" && blockInput) {
    blockInput.value = window.G1_BLOCK;
    blockInput.readOnly = true;
    document.body.classList.add("has-task");
  }

  // ★ validate_materials.py の count_chars と同じ規則:
  //   空白（\s）と Unicode カテゴリ C（制御・書式・私用領域外の非文字）を数えない。
  //   Python の str は コードポイント単位で反復するため、Array.from で揃える
  //   （Intl.Segmenter の書記素単位にすると Python 側と数が食い違う）。
  // ⚠️ `\p{C}` は ES2018+ の Unicode property escape。**正規表現リテラルは
  //    パース時に評価される**ため、古い実行環境だとスクリプト全体が SyntaxError で死に、
  //    カウンタが 0 のまま固まる（気づきにくい壊れ方）。new RegExp + try/catch にして、
  //    使えないときは制御文字の範囲判定に落とす（`/cross-review` 2026-08-03 の指摘）。
  var SPACE = /\s/;
  var OTHER;
  try {
    OTHER = new RegExp("\\p{C}", "u");
  } catch (e) {
    // 制御・書式文字の主要レンジ（Cc / Cf の代表）。Python 側の category(ch)[0]=="C" の
    // 近似であって厳密な同値ではない。★ 実用上ここに落ちるのは古い環境だけである。
    OTHER = /[\u0000-\u001F\u007F-\u009F\u00AD\u200B-\u200F\u2028-\u202E\u2060-\u206F\uFEFF]/;
  }

  function countChars(text) {
    var n = 0;
    var chars = Array.from(text);
    for (var i = 0; i < chars.length; i++) {
      var ch = chars[i];
      if (!SPACE.test(ch) && !OTHER.test(ch)) n++;
    }
    return n;
  }

  function refresh() {
    out.textContent = String(countChars(pad.value));
  }

  // input は IME 変換の確定時にも発火する。変換途中の未確定文字列も value に載るため、
  // 数値は変換中に揺れるが、確定後は必ず正しい値に落ち着く（打鍵挙動には介入しない）。
  pad.addEventListener("input", refresh);

  // ★★ 消去は 2 段階にする（2026-08-05 追加）。
  //   ⚠️ このボタンは記入欄のすぐ下にあり、押すと**取り返しがつかない**（保存していないため）。
  //   ★ 文字数を控える前に消してしまうと、そのブロックの産出量が永久に取れない
  //     （P-1 では 4 ブロックとも産出量を取り損ねた）。
  //   ★ 本文が空のときは 1 回で消える（確認する意味が無いので邪魔をしない）。
  var CLEAR_LABEL = "本文を消去する";
  var ARMED_LABEL = "もう一度押すと消えます";
  var armed = false;
  var armTimer = null;

  function disarm() {
    armed = false;
    if (armTimer) { clearTimeout(armTimer); armTimer = null; }
    clearBtn.textContent = CLEAR_LABEL;
    clearBtn.classList.remove("arm");
  }

  clearBtn.addEventListener("click", function () {
    // ★ ブロック終了時に文字数を控えてから押す。
    //   本文をメモリからも落とし、次ブロックが前ブロックの続きから始まらないようにする。
    if (pad.value.length > 0 && !armed) {
      armed = true;
      clearBtn.textContent = ARMED_LABEL;
      clearBtn.classList.add("arm");
      // ★ 押しっぱなしにしない。10 秒で元に戻す（押す気が無かった人を待たせない）。
      armTimer = setTimeout(disarm, 10000);
      return;
    }
    pad.value = "";
    disarm();
    refresh();
    // ⚠️ 5 分経過後は読み取り専用なので、フォーカスを戻して打鍵を誘わない。
    if (!document.body.classList.contains("g1-over")) pad.focus();
  });

  // ★ 消すつもりが無くなったら（また書き始めたら）解除する。
  pad.addEventListener("input", function () { if (armed) disarm(); });

  // ★★ 5 分の終了通知（2026-08-05 追加・在宅実施を前提にした）。
  //
  //   ⚠️ ★ なぜ要るか: protocol.md §4.4 は「無人在宅では被験者自身が計る」と書いているが、
  //      **P-1 でそれは起きなかった**（4 ブロック中 3 本が 5 分を大きく超過した。
  //      被験者は手順を全部知っている研究者本人だった）。
  //      ブロック長は事後に検出はできるが、決まりにより**後から落とせない**。
  //      → ★ **止められるのは実施中だけ**なので、道具をこのページに置く。
  //
  //   ⚠️ ★ 出すのは「終わった」だけである。**残り時間は出さない**（§4.4）。
  //   ⚠️ ★ 起点は**このページを開いた時刻**である。手順では、アプリを起動してから
  //      そのブロックのページを開くことになっているので、開いた時点が開始である。
  //      → 注意書きにもそう書いてある（先に開いて放置しない）。
  var BLOCK_MS = 5 * 60 * 1000;

  function timeIsUp() {
    if (document.body.classList.contains("g1-over")) return;
    document.body.classList.add("g1-over");
    // ★ readOnly にする（disabled ではない）。⚠️ disabled だと本文が選択できなくなり、
    //   文字数を確かめる邪魔になる。★ **本文は消さない**（控えるまで画面に残す）。
    pad.readOnly = true;
    disarm();
    pad.blur();
    // ★ 文字数を確実に画面へ入れる（⚠️ 実測で画面外に出ていた）。
    //   ★ ここで見せたいのは本文ではなく**文字数**である。
    var f = document.querySelector("footer");
    if (f && f.scrollIntoView) f.scrollIntoView({ block: "end" });
  }

  setTimeout(timeIsUp, BLOCK_MS);

  // ★ 誤って閉じる・再読み込みするとブロックの本文が失われ、そのブロックの
  //   産出文字数（§3.5 の報告義務）が取れなくなる。保存はしないが、警告は出す。
  window.addEventListener("beforeunload", function (e) {
    if (pad.value.length === 0) return;
    e.preventDefault();
    e.returnValue = "";
  });

  refresh();
  pad.focus();
})();
</script>
</body>
</html>
