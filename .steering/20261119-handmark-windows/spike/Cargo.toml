[package]
name = "handmark-win-spike"
version = "0.0.0"
edition = "2021"
publish = false

# 使い捨ての試作（main の src-tauri には入れない・ADR-051 D7 の先例・判断 7）。
# target/ は scratchpad に置く（CARGO_TARGET_DIR）。

[workspace]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }
