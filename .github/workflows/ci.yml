name: CI / Release

on:
  push:
    branches: [main, "feature/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # ★ 検証用の Windows ビルドを **タグを切らずに** 作るための手動発火 (2026-08-06)。
  #
  # ⚠️ なぜ要るか: Windows の portable exe を作るのは `build-windows` だけで、従来は
  #   **タグ push (`v*`) でしか動かなかった**。G1 の Windows 検証
  #   (`experiments/20260801-controlled-friction-task/windows-verification.md`) のために
  #   タグを切ると、(a) self-hosted の macOS ランナーが要る、(b) GitHub Release が作られる、
  #   (c) バージョン番号を 1 つ消費する — と副作用が大きい。
  # ★ 手動発火では `build-windows` だけを走らせる (`check` / `frontend-check` / `release` は動かさない)。
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always

jobs:
  # ── ブランチ push / PR: 両 OS で build + test + snapshot 回帰 ──
  # 旧 `cargo check` のみから拡充 (2026-04-15, Phase 1 ci-matrix-build)。
  # Windows / macOS 両方で毎 push 検証することで、#[cfg] 分岐漏れを早期検知。
  # macOS ジョブのみ self-hosted に移行 (2026-08-01)。
  #
  # 理由: private repo の GitHub-hosted 分数は **macOS が 10倍**・Windows が 2倍・Linux が 1倍で
  # 課金される。毎 push の macOS check + タグ時の macOS リリースビルド (40分=400分課金) が
  # 無料枠 (2000分/月) を食い潰していた。その回避としてリポジトリを一時 public にしていたが、
  # public 化は **履歴全体を公開**するため experiments/ の被験者水準データが露出する。
  # 研究記録を消すのではなく public 化そのものをやめる、というのが本変更の意図。
  #
  # ★ Windows も self-hosted へ移行 (2026-08-15)。目的は **課金・無料枠を浮かせること**。
  #   Windows は 2倍課金で、毎 push の check が恒常的な支出になっていた
  #   (タグ時のみ走る `build-windows` は **hosted のまま**残す。下記参照)。
  #
  # ★ ランナーを載せる Windows 機は **G-GEAR (MS-7E66 / Ryzen 7 9700X 8C16T / 31GB)**。
  #   ⚠️ Surface Pro 8 は `docs/agent-shared.md` の**製品ターゲット**であって、CI ランナーではない。
  # ⚠️★★★ この G-GEAR は macOS 機と違い **たまにシャットダウンしている**。
  #   self-hosted はランナー offline 時にジョブが **キューへ滞留**する (hosted への自動
  #   フォールバックは無い)。しかも:
  #   - `timeout-minutes` は **ジョブの実行時間にしか効かない**。キュー待ちには適用されない
  #   - 滞留したジョブは **24〜48 時間**経ってからキャンセルされる
  #   → ★ 「短い timeout を付けたプローブジョブ」では救えない (2026-08-15 に実測確認)。
  #
  # ★ そこで `decide-win-runner` を前段に置く: ランナーの online/offline を API で
  #   **最大 30 秒ポーリング**し、生きていなければ `windows-latest` (従来) へ落とす。
  #   **失敗側は必ず hosted** (token 無し / API エラー / タイムアウト) = キューに滞留させない。
  #
  # ⚠️ 救えない範囲を明記する: 割り当ては**ジョブ開始時に確定**するため、
  #   **ビルド途中で G-GEAR が落ちた場合は救えない** (そのジョブは失敗する)。
  #   `if: failure()` の再実行ジョブを足せば救えるが、本物のテスト失敗でも再実行され
  #   Windows は 2倍課金なので、**目的 (課金削減) と衝突するため採らなかった**。
  #
  # ⚠️ `GITHUB_TOKEN` では self-hosted ランナーの一覧を取得できない (2026-08-15 実測)。
  #   fine-grained PAT (当 repo のみ・`Administration: Read`・期限付き) を
  #   secret `RUNNER_STATUS_TOKEN` に置く。**未設定なら常に hosted へ落ちる** (fail-safe)。
  decide-win-runner:
    # ★ `check` と同じ条件にする (ここが skip されると `check` も skip されるため)。
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs_on: ${{ steps.probe.outputs.runs_on }}
    steps:
      - name: Probe self-hosted Windows runner (max 30s, fail-safe to hosted)
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -uo pipefail
          HOSTED='["windows-latest"]'
          SELF='["self-hosted","gse-win"]'

          decide() {
            echo "runs_on=$1" >> "$GITHUB_OUTPUT"
            echo "resolved runs-on = $1"
            exit 0
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::RUNNER_STATUS_TOKEN is unset -> hosted (fail-safe)"
            decide "$HOSTED"
          fi

          # 5s x 6 = 最大 30s。★ 起き上がりかけを拾うためポーリングにしている。
          for i in 1 2 3 4 5 6; do
            body="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" 2>/dev/null || true)"
            if [ -n "$body" ]; then
              online="$(printf '%s' "$body" \
                | jq -r '[.runners[] | select(.status=="online" and (any(.labels[]; .name=="gse-win")))] | length' \
                2>/dev/null || echo 0)"
              if [ "${online:-0}" -gt 0 ]; then
                echo "::notice::gse-win runner is online (attempt ${i}) -> self-hosted"
                decide "$SELF"
              fi
            else
              echo "::warning::runner status API call failed (attempt ${i})"
            fi
            if [ "$i" -lt 6 ]; then sleep 5; fi
          done

          echo "::notice::gse-win did not come online within 30s -> hosted (fallback)"
          decide "$HOSTED"

  check:
    # ★ 手動発火では走らせない (self-hosted の macOS ランナーが offline だとキューへ滞留するため。
    #   手動発火の目的は Windows の exe を 1 個作ることだけである)。
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
    # ⚠️ mac 側も decide の完了を待つ (最大 30 秒)。両 OS を 1 matrix に保つための代償。
    needs: decide-win-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: gse-win-selfhosted
            target: x86_64-pc-windows-msvc
          - runner: gse-mac-selfhosted
            target: aarch64-apple-darwin
    # ⚠️ matrix が 2 本である前提の三項式。★ 3 本目を足すときはここを必ず書き換えること。
    runs-on: ${{ matrix.runner == 'gse-mac-selfhosted' && fromJSON('["self-hosted","gse-mac"]') || fromJSON(needs.decide-win-runner.outputs.runs_on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Cargo build (${{ matrix.target }})
        run: cargo build --target ${{ matrix.target }}
        working-directory: src-tauri
      - name: Cargo test --workspace
        run: cargo test --workspace --target ${{ matrix.target }}
        working-directory: src-tauri
      - name: Snapshot regression (gse-replay --snapshot)
        run: cargo run --bin gse-replay --target ${{ matrix.target }} -- tests/fixtures/minimal.ndjson --snapshot tests/snapshots/minimal.json
        working-directory: src-tauri
      # Schema drift check (Phase 1 dataset-repo-setup):
      # schema_dto.rs から emit_schema で再生成した JSON Schema が
      # コミット済み schema/current.json と一致することを保証する。
      # drift があれば CI FAIL し、gse-dataset 側同期が必要と通知される。
      - name: Schema drift check (NDJSON JSON Schema)
        shell: bash
        run: |
          cargo run --bin emit_schema --target ${{ matrix.target }} > /tmp/emitted-schema.json
          diff -u schema/current.json /tmp/emitted-schema.json
        working-directory: src-tauri

  # ── ブランチ push / PR: Frontend 型検査 + Vite ビルド ─────────
  frontend-check:
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Vite production build
        run: npm run build

  # ── タグ push: Windows ビルド ────────────────────────────────
  build-windows:
    # ★ タグ push (リリース) と、手動発火 (検証用ビルド) の両方で走る。
    #   ⚠️ `release` ジョブの `if` はタグ限定のままなので、★ 手動発火では
    #   **Release は作られない**。成果物は Actions の artifact (7 日) だけである。
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    # ★ 2026-08-15: `check` は self-hosted へ移したが、**本ジョブは hosted のまま**にする。
    #   理由: (a) タグ push / 手動発火でしか走らないので**恒常的な支出ではない**、
    #        (b) リリース成果物を作るジョブであり、⚠️ **G-GEAR が途中で落ちると
    #            リリースが壊れる**。割り当ては開始時に確定するのでフォールバックが効かない。
    #   → ★ 課金削減の効き目は毎 push の `check` 側にあり、そこだけを移すのが割に合う。
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          # ★ タグ (リリース) ビルドではキャッシュを**保存しない**。
          # v0.1.22 で実害が出た: 成果物 (dmg / tools) は全部できていて ##[error] も 0 件なのに、
          # post ステップの `Failed to save: Unable to reserve cache with key ...` だけで
          # job が failure になり、release ジョブの macOS ダウンロード段
          # (`needs.build-macos.result == 'success'`) が弾かれて **dmg がリリースから落ちた**。
          # ⚠️ ここで release 側のゲートを緩めると「本当にビルドが壊れたとき」に
          #    部分的なリリースを黙って公開してしまうので、緩めるのは**保存側**にする。
          # 復元は従来どおり行うのでビルド時間は変わらない。キャッシュの更新は
          # 頻繁に走る check ジョブ (main / PR) が担う。
          save-if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # リリースゲート: Windows の提出ツール (gse-submit.exe) も exe 隣の pubkey.txt を
      # recipient として使う (lib.rs:resolve_bundled_recipient のフォールバック元と同じ鍵ファイル)。
      # build-macos の同名ステップと同条件。★ workflow_dispatch (タグを切らない手動検証ビルド)
      # では走らせない — 手動発火の目的は exe を 1 個作ることだけで、リリース鍵の有無を問わない。
      - name: Verify researcher public key present (release gate)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ! grep -qE '^[[:space:]]*age1[0-9a-z]+' src-tauri/resources/pubkey.txt; then
            echo "::error::src-tauri/resources/pubkey.txt に 'age1...' 公開鍵行がありません。リリース前に研究者の実鍵を挿入してください (プレースホルダのままでは参加者が提出不能)。"
            exit 1
          fi
          echo "pubkey.txt OK (age1 line present)"
      - name: Build Tauri app
        # ★ インストーラ (NSIS) は作らない (2026-08-03)。Phase1 の実運用で被験者が使ったのは
        #   **ポータブル版 gse-next.exe** だけだった (Smart App Control の都合で
        #   docs/participant-setup-guide.md も portable を案内している)。
        #   インストーラを配ると「どちらを使うのか」が増えるだけで、実績が無い。
        #   ⚠️ ポータブル exe は cargo の成果物 (target/release/gse-next.exe) なので
        #      バンドラは不要。`--no-bundle` でフロントのビルドと cargo build までを行う。
        run: npx tauri build --no-bundle
      - name: Upload portable exe (SAC bypass)
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: src-tauri/target/release/gse-next.exe
          if-no-files-found: warn
          retention-days: 7
      # 提出/復号ツール（package feature。アプリ本体のビルドは --features package 非使用のため別途ビルド）。
      - name: Build submission/decrypt tools (package feature)
        working-directory: src-tauri
        run: cargo build --release --features package --bin gse-submit --bin gse-unpack
      - name: Upload Windows tools
        uses: actions/upload-artifact@v4
        with:
          name: windows-tools
          # ★ 被験者が使うのは gse-submit.exe だけ (アプリ内提出も 提出する_win.bat も
          #   これを exe と同階層に要求する)。gse-unpack.exe は**研究者専用の復号器**で、
          #   .app / インストーラから意図的に除外されているため Release が唯一の入手経路。
          #   ⚠️ gse-package.exe (手動フォールバック) は Phase1 で使われなかったので配らない。
          path: |
            src-tauri/target/release/gse-submit.exe
            src-tauri/target/release/gse-unpack.exe
          if-no-files-found: error
          retention-days: 7

  # ── タグ push: macOS ビルド ──────────────────────────────────
  build-macos:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    # Ad-hoc 署名 (APPLE_SIGNING_IDENTITY: "-") のため Developer 証明書に依存せず、
    # self-hosted へ移しても署名フローは変わらない。
    runs-on: [self-hosted, gse-mac]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          # ★ タグ (リリース) ビルドではキャッシュを**保存しない**。
          # v0.1.22 で実害が出た: 成果物 (dmg / tools) は全部できていて ##[error] も 0 件なのに、
          # post ステップの `Failed to save: Unable to reserve cache with key ...` だけで
          # job が failure になり、release ジョブの macOS ダウンロード段
          # (`needs.build-macos.result == 'success'`) が弾かれて **dmg がリリースから落ちた**。
          # ⚠️ ここで release 側のゲートを緩めると「本当にビルドが壊れたとき」に
          #    部分的なリリースを黙って公開してしまうので、緩めるのは**保存側**にする。
          # 復元は従来どおり行うのでビルド時間は変わらない。キャッシュの更新は
          # 頻繁に走る check ジョブ (main / PR) が担う。
          save-if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # リリースゲート: アプリ内提出 (案A sidecar) は同梱 pubkey.txt を recipient に使う。
      # プレースホルダ (age1 行なし) のままリリースすると参加者全員が提出不能になるため、
      # 実鍵が挿入されていることを機械的に検証する (dev/test ビルドは本ステップを通らない)。
      - name: Verify researcher public key present (release gate)
        shell: bash
        run: |
          if ! grep -qE '^[[:space:]]*age1[0-9a-z]+' src-tauri/resources/pubkey.txt; then
            echo "::error::src-tauri/resources/pubkey.txt に 'age1...' 公開鍵行がありません。リリース前に研究者の実鍵を挿入してください (プレースホルダのままでは参加者が提出不能)。"
            exit 1
          fi
          echo "pubkey.txt OK (age1 line present)"
      - name: Build Tauri app
        # `--features package` is required on macOS: the .app bundler copies *every*
        # `[[bin]]` of the crate into Contents/MacOS/, including `gse-package` / `gse-unpack`
        # which are gated behind `required-features = ["package"]`. Without the flag those
        # binaries are never built and bundling fails ("Failed to copy binary ... does not
        # exist").
        #
        # ★★ ISOLATION CLAIM — MEASURED 2026-08-08 (do not re-litigate from theory).
        # A reviewer flagged this as broken reasoning: cargo unifies features per crate, so
        # the *library* IS compiled with `package` here, therefore (they argued) the blind
        # app links `age` + `reqwest` + rustls. The mechanism is right; the conclusion is not.
        # Unused rlib objects are dropped at link time. Measured on the actual release binary
        # (`cargo build --release --features package --bin gse-next`, same profile as here):
        #   strings gse-next  | grep -c rustls              -> 0
        #   strings gse-next  | grep -c aws_lc_rs           -> 0
        #   strings gse-next  | grep -c reqwest             -> 0
        #   strings gse-next  | grep -c age-encryption.org  -> 0
        # Positive control (same technique on a binary that DOES link them):
        #   strings gse-submit | grep -c rustls             -> 78
        #   strings gse-submit | grep -c age-encryption.org -> 4
        # And `strings gse-next | grep -c gse_next_lib -> 6`, so the tool does read this
        # binary (the zeros are not an empty measurement).
        # => The `age`/HTTP isolation (Cargo.toml, decisions D3 / D-7) HOLDS for the shipped
        #    macOS app. If this build command or the profile changes, RE-MEASURE — do not
        #    assume either way.
        run: npx tauri build --bundles dmg --features package
        env:
          APPLE_SIGNING_IDENTITY: "-"  # Ad-hoc signing (no Apple Developer certificate)
      - name: Re-sign app bundle with entitlements (layered, no --deep)
        run: |
          APP=$(find src-tauri/target/release/bundle -name "*.app" -type d | head -1)
          if [ -n "$APP" ]; then
            BINARY="$APP/Contents/MacOS/gse-next"
            ENTITLEMENTS="src-tauri/Entitlements.plist"

            # 研究者専用 CLI (gse-package=手動提出 / gse-unpack=復号) を .app から除去する。
            # macOS バンドラは --features package ビルドの全 [[bin]] を Contents/MacOS へ自動コピー
            # するが、被験者配布物にこれらは不要 (アプリ内提出は gse-submit のみ使用)。鍵が無ければ
            # gse-unpack は無力で機密漏れではないが、配布物を最小化する (再署名前に削除し署名整合を保つ)。
            # Release のツール資産は target/release/ 由来 (別経路) なので研究者は引き続き取得できる。
            echo "=== Stripping researcher-only CLIs from .app ==="
            rm -f "$APP/Contents/MacOS/gse-package" "$APP/Contents/MacOS/gse-unpack"
            ls "$APP/Contents/MacOS/"

            # レイヤード署名: --deep は Apple 非推奨。
            # ネスト署名の不整合が TCC の権限拒否を引き起こす可能性があるため、
            # 内部バイナリ → 外部バンドルの順に個別署名する。
            # --options runtime は ad-hoc 署名では使用しない（TCC 過剰検証の原因）。

            # アプリ内提出 (案A) のサイドカー = 同梱 gse-submit を含むヘルパ CLI を個別署名する。
            # ヘルパは app の TCC 権限を必要としないため entitlements なしの素の ad-hoc 署名にし、
            # 署名済みバンドルにネスト未署名バイナリが残らないようにする (署名整合・AMFI 対策)。
            echo "=== Signing bundled helper binaries (sidecar) ==="
            for HELPER in gse-submit gse-package gse-unpack; do
              if [ -f "$APP/Contents/MacOS/$HELPER" ]; then
                codesign --force --sign - "$APP/Contents/MacOS/$HELPER"
                echo "signed $HELPER"
              fi
            done

            echo "=== Signing inner binary ==="
            codesign --force --sign - --entitlements "$ENTITLEMENTS" "$BINARY"

            echo "=== Signing app bundle ==="
            codesign --force --sign - --entitlements "$ENTITLEMENTS" "$APP"

            # アプリ内提出の前提物がバンドルに含まれることを保証する (欠落でリリースを止める)。
            echo "=== Asserting in-app submit prerequisites in bundle ==="
            test -f "$APP/Contents/MacOS/gse-submit" || { echo "::error::gse-submit が .app に同梱されていません (アプリ内提出が動作しない)"; exit 1; }
            ls "$APP/Contents/Resources/"*pubkey.txt "$APP/Contents/Resources/resources/pubkey.txt" 2>/dev/null | head -1 | grep -q pubkey.txt \
              || { echo "::error::pubkey.txt が .app の Resources に同梱されていません (recipient 未解決で提出不能)"; exit 1; }
            if [ -e "$APP/Contents/MacOS/gse-package" ] || [ -e "$APP/Contents/MacOS/gse-unpack" ]; then
              echo "::error::researcher 専用 CLI (gse-package/gse-unpack) が .app に残存 (strip 失敗)"; exit 1
            fi

            echo "=== Verification ==="
            codesign --verify --strict "$APP" && echo "Signature OK" || echo "Signature verification failed"

            echo "=== CDHash (for TCC debugging) ==="
            codesign -dvvv "$APP" 2>&1 | grep -E "CDHash|Identifier|TeamIdentifier" || true

            echo "=== Embedded entitlements ==="
            codesign -d --entitlements - "$APP" 2>&1 || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
      # 提出/復号ツール（macOS は --features package 付き tauri build で既にビルド済み）。
      - name: Upload macOS tools
        uses: actions/upload-artifact@v4
        with:
          name: macos-tools
          # ★ macOS は **dmg だけで完結する** (.app に gse-submit と pubkey.txt が同梱され、
          #   アプリ内提出が正規ルート)。Phase1 の実運用でも mac は dmg のみで完了した。
          #   → 単体 gse-submit / gse-package は配らない (mac の 提出する_mac.command 経路は廃止)。
          #   gse-unpack は**研究者専用の復号器**で .app から意図的に strip されているため残す。
          path: |
            src-tauri/target/release/gse-unpack
          if-no-files-found: error
          retention-days: 7

  # ── GitHub Release 作成（片方成功でも実行）──────────────────
  release:
    needs: [build-windows, build-macos]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      always() &&
      (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows portable artifacts
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/
        continue-on-error: true

      - name: Download macOS artifacts
        if: ${{ needs.build-macos.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/

      - name: Download Windows tools
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-tools
          path: artifacts/
        continue-on-error: true

      - name: Download macOS tools
        if: ${{ needs.build-macos.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: macos-tools
          path: artifacts/
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
