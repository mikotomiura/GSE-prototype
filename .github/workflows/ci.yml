name: CI / Release

on:
  push:
    branches: [main, "feature/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # ★ 検証用の Windows ビルドを **タグを切らずに** 作るための手動発火 (2026-08-06)。
  #
  # ⚠️ なぜ要るか: Windows の portable exe を作るのは `build-windows` だけで、従来は
  #   **タグ push (`v*`) でしか動かなかった**。G1 の Windows 検証
  #   (`experiments/20260801-controlled-friction-task/windows-verification.md`) のために
  #   タグを切ると、(a) self-hosted の macOS ランナーが要る、(b) GitHub Release が作られる、
  #   (c) バージョン番号を 1 つ消費する — と副作用が大きい。
  # ★ 手動発火では `build-windows` だけを走らせる (`check` / `frontend-check` は動かさない)。
  #
  # ⚠️★★★ **訂正 (security-checker 指摘, 2026-08-31)**: 旧文は「`release` も動かさない」と
  #   書いていたが、★ **それはブランチを選んだ場合にしか成り立たない**。
  #   `release` の `if` は `startsWith(github.ref, 'refs/tags/v')` だけを見ていて
  #   `github.event_name` を見ていない。⚠️ したがって **手動発火で「タグ」を選ぶと
  #   `build-macos` が `gse-mac` 実機で走り、`release` が GitHub Release を作る**。
  #   ★ 発火できるのは write 権限保持者だけ (現在 collaborator は 1 名) なので権限昇格では
  #   ないが、⚠️ **「押しても Release はできない」と思って押すと実際にできてしまう**。
  #   → 挙動そのものは**変えていない** (同一タグの再リリース手順がこれに依存しうるため)。
  #     ★ 締めたいなら `build-macos` / `release` の `if` に
  #     `github.event_name != 'workflow_dispatch'` を足す。
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ⚠️★★★ **`GITHUB_TOKEN` の既定権限を最小にする** (F-5・2026-09-12)。
#
# ★ 直したい失敗様式は「**job を足したとき `permissions:` を書き忘れ、repo 既定の広い権限を
#   継ぐ**」である。⚠️ 実測 (2026-09-12・`ci.yml` を yaml パース): `decide-win-runner` /
#   `check` / `build-windows` / `build-macos` の **4 job に `permissions:` が無かった**。
#   → ★ **個別付与ではなく top-level に置く** —— 個別付与は今ある 4 job しか直さないが、
#   top-level は**今後足す job も既定で最小**になる。
#
# ★ job 側の宣言は top-level を**上書きする**ので、既存 2 job の挙動は変わらない:
#   `frontend-check` = `contents: read` (冗長だが明示のまま残す) /
#   `release` = `contents: write` (⚠️ GitHub Release の作成に必要)。
#
# ★ `contents: read` で足りる根拠 (⚠️ 使用 action を全数列挙して確認した):
#   `actions/checkout` (★ これだけが `contents: read` を要る) /
#   `dtolnay/rust-toolchain` / `Swatinem/rust-cache` / `actions/setup-node` /
#   `actions/upload-artifact` / `actions/download-artifact` / `./.github/actions/disk-guard`。
#   ⚠️ artifact と cache は **Actions ランタイムトークン**を使い `GITHUB_TOKEN` を使わない。
#   ★ `decide-win-runner` の `gh api .../actions/runners` は
#   **`secrets.RUNNER_STATUS_TOKEN` (別 PAT)** を使っており (下記 L196 付近)、本設定の影響外
#   (⚠️ そもそも `GITHUB_TOKEN` では取得できないと L137 に実測が記録されている)。
#
# ⚠️★★★ **検証の限界**: ★ `build-windows` / `build-macos` / `release` は `if` により
#   **tag push か `workflow_dispatch` でしか走らない**ので、**通常の PR 実行では検証できない**。
#   → ★ `workflow_dispatch` を**ブランチ指定で**発火して `build-windows` を実機確認した
#   (⚠️ tag を選ぶと Release ができるので選ばない。上の L33-46 の注記を参照)。
permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always

# ⚠️★★★ self-hosted ランナーと「外部 fork からの PR」について (security-checker HIGH, 2026-08-31)
#
# ★ 実測された配置:
#   - self-hosted ランナーは **研究者本人のユーザー**で動いている
#     (`johnd /Users/johnd/actions-runner/bin/Runner.Listener run --startuptype service`)。
#     ⚠️ コンテナでも専用ユーザーでもないので、ジョブは home 全体を読める。
#   - 同じ home に `~/.gse/age-identity.txt` (0600) —— ⚠️ **被験者の提出物 `.age` を全部
#     復号できる秘密鍵**  —— と `Form_O1/o1_submit.json` (実 endpoint ＋ secret) がある。
#
# ⚠️ 何が起きうるか: リポジトリが **public の状態**で外部 fork から PR が出されると、
#   `pull_request` トリガーの self-hosted ジョブに **fork 側が書いた任意のコード**が載り、
#   それが研究者の home を読める。→ 被験者データの機密性が一撃で失われる。
#
# ★ いまは成立しない (`gh repo view` で PRIVATE を確認済み・2026-08-31)。
#   ⚠️ しかし上の L33-37 が記録しているとおり、**無料枠回避で一時 public にしていた実績がある**。
#   → 「今 private だから安全」は運用の偶然であって設計上の防御ではない。
#
# ★ そこで fork からの PR では self-hosted ジョブを走らせないようにする。
#   ⚠️ 同一 repo 内のブランチ PR (通常の運用) は `head.repo.full_name == github.repository` を
#   満たすので**従来どおり走る**。push / tag では `github.event.pull_request` 自体が無く、
#   `github.event_name != 'pull_request'` が真になるため影響しない。
#   ★ `head.repo` が null (fork が削除された等) の場合も比較が偽になり **fail-closed**。
#
# ⚠️★★★ **このゲートは防御ではない。事故防止である。** (security-checker 指摘, 2026-08-31)
#   ★ `pull_request` イベントで使われるワークフロー定義は **base ではなく PR head 側**
#   (base に head をマージしたコミット) から読まれる。⚠️ つまり **攻撃者の PR 自身が
#   この `if` の行を消せる**。→ 止まるのは「ci.yml を触らない fork PR」(＝事故・善意の
#   コントリビュータ) だけであり、鍵を狙って ci.yml も書き換える PR は**止まらない**。
#   ⚠️ 初版のここには「fork からの PR では self-hosted ジョブを**一切**走らせない」と
#   書いていた。★ **それは誤りだったので訂正した。**
#
# ⚠️ 副作用を明記する: 外部 fork の PR では `check` / `build-macos` が skip され、
#   hosted の `frontend-check` だけが走る。★ 外部 fork の変更をフルに検証したいときは、
#   その内容を **repo 内のブランチへ取り込んでから** PR を出し直すこと。
#
# ⚠️★★★ **本当の境界は 3 つあり、どれもこのファイルの中に無い**:
#   (0) ⚠️★★★ **workflow は 1 枚ではない** (2026-09-12) —— ★ `supply-chain.yml` が増えた。
#       ⚠️ 本注記は `ci.yml` の話しかしていないので、public 化を検討するときは
#       **`.github/workflows/` を全部数えてから**この節を読み直すこと。
#   (1) リポジトリを **public にしない** (★ 2026-08-31 実測: `gh repo view` = PRIVATE)
#   (2) public にするなら**その直後に** Settings → Actions → Fork pull request workflows を
#       **"Require approval for all external collaborators"** にする。
#       ⚠️ private のうちは事前に固められない —— API が
#       `422 Fork PR approval is not allowed for private repositories` を返す (実測)。
#       ★ public 化の既定は「初回コントリビュータのみ承認」であり、**1 度 merge された相手は
#       以後**無承認で self-hosted に到達する。
#   (3) ★ 候補 c: `~/.gse/age-identity.txt` を**ランナーと別マシン / 別アカウント**へ退避する。
#       ⚠️ これが唯一の本質的対策である (ランナーを専用ユーザー or 使い捨て VM にするのも同義)。
#       ★ GitHub 自身が「self-hosted runner は private repo でのみ使うこと」を推奨している。
#
# ⚠️★★ public 化のチェックリストに 1 項目追加する (security-checker 実測, 2026-09-02):
#   ★ GitHub は **全 self-hosted job のログ冒頭**に `Runner name:` と `Machine name:` を
#   無条件で出し、REST API `.../actions/runs/<id>/jobs` も `runner_name` を返す。
#   ⚠️ 実測すると Windows 実機の `Machine name:` の値が **研究者の実名 (下の名前) を含んでいた**。
#   ★ ⚠️ **ここに実値は書かない** —— 「実名が漏れる」と警告する当のコメントが実名を
#     repo に刻んでは本末転倒である (Codex 指摘, 2026-09-02 `/cross-review`)。
#     ★ 値を確かめたいときは実機か `gh api .../actions/runs/<id>/jobs` の `runner_name` を見ること。
#   → ★ **public 化すると過去ぶんを含む全ログに載る。ci.yml からは除去できない。**
#   → ⚠️ public 化するなら**その前に** Windows 実機のコンピュータ名とランナー登録名を
#     非個人名へ変更すること (★ private を維持するならこの項目は発火しない)。
#
# ⚠️ 関連リスク: third-party action が乗っ取られると、push / tag ビルドでも実機の鍵を読まれる
#   (★ 本ゲートは**一切効かない**)。⚠️ repo 設定も `allowed_actions: all` /
#   `sha_pinning_required: false` (実測)。
#
#   ⚠️★★★ **2026-09-13 (F-8) に対処したのは *third-party だけ* である。**
#     ★ 実測: 鍵のある実機 (`check` / `build-macos`) で走る `uses:` のうち、
#     **`actions/checkout@v4` / `setup-node@v4` / `upload-artifact@v4` は可変タグのまま**。
#     ⚠️ `release` (`contents: write`) の `actions/download-artifact@v4` も同様なので、
#     **「被験者が落とすバイナリを守った」とまでは言えない** (★ 成果物を用意するのは
#     download-artifact である)。→ ★ 申し送り: `actions/*` を固定範囲に含めるかは別裁定。
#
#   ★ 固定した third-party 3 本:
#     - `dtolnay/rust-toolchain@6bed076…` (⚠️ 旧 `@stable` は**タグですらなくブランチ**だった)
#     - `Swatinem/rust-cache@6323deb…` (v2.9.2・⚠️ ただし `check` / `build-macos` では
#       `if: runner.environment == 'github-hosted'` が付いており **self-hosted では走らない**。
#       ★ 固定が効くのは hosted fallback と `build-windows`)
#     - `softprops/action-gh-release@3bb1273…` (v2.6.2・⚠️ `contents: write` を持ち
#       **被験者が落とすバイナリを差し替えうる**ので hosted でも固定した)
#
#   ⚠️★★★ **`actions/*` は意図的にタグのまま**にしている (★ 無言で非対称にしないため書く):
#     GitHub 自社所有で、⚠️ **dependabot を入れない裁定 (D12) の下では固定＝更新が完全に手動**に
#     なり、★ 固定した方が古いまま放置されるリスクの方が大きいと判断した。
#     → ⚠️ この判断を変えるなら `scripts/check_workflow_invariants.py` の規則も一緒に変えること。
#
#   ★ **固定が「決めたきり」にならないよう機械で守っている** ——
#     `scripts/check_workflow_invariants.py` が **third-party action の可変参照を CI で赤にする**
#     (⚠️ 新しい action を可動タグで足した瞬間に落ちる)。
#     ★ 版を上げる手順は `docs/verification-runbook.md` §1 (h)。
#
#   ⚠️ **残っている本丸は別にある**: ★ `ci.yml:112` の「候補 c: `~/.gse/age-identity.txt` を
#     ランナーと別マシン / 別アカウントへ退避する」。⚠️ SHA 固定は**上流乗っ取りを遅らせるだけ**で、
#     鍵が同じ home にある限り「実機で任意コードが走れば鍵が読める」構図は変わらない。

jobs:
  # ── ブランチ push / PR: 両 OS で build + test + snapshot 回帰 ──
  # 旧 `cargo check` のみから拡充 (2026-04-15, Phase 1 ci-matrix-build)。
  # Windows / macOS 両方で毎 push 検証することで、#[cfg] 分岐漏れを早期検知。
  # macOS ジョブのみ self-hosted に移行 (2026-08-01)。
  #
  # 理由: private repo の GitHub-hosted 分数は **macOS が 10倍**・Windows が 2倍・Linux が 1倍で
  # 課金される。毎 push の macOS check + タグ時の macOS リリースビルド (40分=400分課金) が
  # 無料枠 (2000分/月) を食い潰していた。その回避としてリポジトリを一時 public にしていたが、
  # public 化は **履歴全体を公開**するため experiments/ の被験者水準データが露出する。
  # 研究記録を消すのではなく public 化そのものをやめる、というのが本変更の意図。
  #
  # ★ Windows も self-hosted へ移行 (2026-08-15)。目的は **課金・無料枠を浮かせること**。
  #   Windows は 2倍課金で、毎 push の check が恒常的な支出になっていた
  #   (タグ時のみ走る `build-windows` は **hosted のまま**残す。下記参照)。
  #
  # ★ ランナーを載せる Windows 機は **G-GEAR (MS-7E66 / Ryzen 7 9700X 8C16T / 31GB)**。
  #   ⚠️ Surface Pro 8 は `docs/agent-shared.md` の**製品ターゲット**であって、CI ランナーではない。
  # ⚠️★★★ この G-GEAR は macOS 機と違い **たまにシャットダウンしている**。
  #   self-hosted はランナー offline 時にジョブが **キューへ滞留**する (hosted への自動
  #   フォールバックは無い)。しかも:
  #   - `timeout-minutes` は **ジョブの実行時間にしか効かない**。キュー待ちには適用されない
  #   - 滞留したジョブは **24〜48 時間**経ってからキャンセルされる
  #   → ★ 「短い timeout を付けたプローブジョブ」では救えない (2026-08-15 に実測確認)。
  #
  # ★ そこで `decide-win-runner` を前段に置く: ランナーの online/offline を API で
  #   **最大 30 秒ポーリング**し、生きていなければ `windows-latest` (従来) へ落とす。
  #   **失敗側は必ず hosted** (token 無し / API エラー / タイムアウト) = キューに滞留させない。
  #
  # ⚠️ 救えない範囲を明記する: 割り当ては**ジョブ開始時に確定**するため、
  #   **ビルド途中で G-GEAR が落ちた場合は救えない** (そのジョブは失敗する)。
  #   `if: failure()` の再実行ジョブを足せば救えるが、本物のテスト失敗でも再実行され
  #   Windows は 2倍課金なので、**目的 (課金削減) と衝突するため採らなかった**。
  #
  # ⚠️ `GITHUB_TOKEN` では self-hosted ランナーの一覧を取得できない (2026-08-15 実測)。
  #   fine-grained PAT (当 repo のみ・`Administration: Read`・期限付き) を
  #   secret `RUNNER_STATUS_TOKEN` に置く。**未設定なら常に hosted へ落ちる** (fail-safe)。
  decide-win-runner:
    # ★ `check` と同じ条件にする (ここが skip されると `check` も skip されるため)。
    # ⚠️ 末尾の 2 行は外部 fork 遮断 (上の env 直下の注記を参照)。本ジョブも `gse-mac` 実機で走る。
    if: >-
      ${{ github.event_name != 'workflow_dispatch'
          && !startsWith(github.ref, 'refs/tags/')
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    # ⚠️★★★ 2026-08-15 時点は `ubuntu-latest` (hosted) だったが、2026-08-26 の GitHub Actions
    #   major outage (githubstatus.com, 15:11-18:01Z) で判明した実測 (`.steering/
    #   20260827-main-ci-push-event-missing/requirement.md` 観測3・「決着」節): 障害中、
    #   hosted 2 ジョブは 15 分キューで `runner_name` 空のまま `cancelled`（hosted 側の
    #   割り当てが機能していない）だった一方、**self-hosted 2 台 (gse-win/gse-mac) は
    #   `online, busy=false` のまま無事**だった。つまり self-hosted 実機は動ける状態なのに、
    #   判定役の本ジョブが hosted のせいで割り当てられず、`check` (needs: decide-win-runner)
    #   ごと道連れでブロックされていた。→ 本ジョブを self-hosted (`gse-mac`) へ移す。
    # ⚠️ 本変更が効く範囲は限定的だと明記する: 障害中は run 自体は作られたが job 割り当てが
    #   死ぬケース (上記) と、**run 自体が空 (job が 1 件も作られない) ケース**の両方が
    #   観測された (後者の実例: run 32985752839, 15:39Z 作成、jobs 0 件)。後者は
    #   Actions のジョブ生成そのものが止まっているため、runs-on をどこに向けても救えない。
    #   本変更が救うのは前者 (job は生成されるが hosted 割り当てだけ死ぬ) のみ。
    # ★ `gse-win` ではなく `gse-mac` を選ぶ: 本ジョブは `gse-win` の online/offline を
    #   probe する役目なので、`gse-win` 自身の上で実行すると `gse-win` が offline のときに
    #   probe ジョブ自体が self-hosted のキュー滞留 (L46-50 参照、timeout-minutes は
    #   キュー待ちに効かず 24-48h 後にしかキャンセルされない) に巻き込まれ判定不能になる。
    #   `gse-mac` は下記 `check` ジョブの mac 側 `runs-on` が既に fallback 無しで無条件に
    #   ジョブを出す前提の機体であり、新しい信頼を増やすものではない。
    #   ⚠️ ただしその前提には条件が付く: `.idea/20260801-self-hosted-runner-setup.md:70-71`
    #   に「Mac の電源とネットワークが前提。スリープ中はジョブがキューに溜まる」と明記あり
    #   (蓋を閉じれば止まる。`caffeinate` か「電源接続時スリープ無効」設定が要る)。
    #   gse-win の「たまにシャットダウンしている」と対比して「mac は無条件に安全」とまでは
    #   言えない — 運用前提 (常時電源・スリープ無効) が守られている場合に限る。
    # ⚠️ トレードオフ 1: `gse-mac` が offline/スリープだと本ジョブごとキューに滞留し、
    #   `check(win)` / `check(mac)` の**両方**がブロックされる (`needs:` で連鎖するため)。
    #   従来は `gse-mac` offline の影響は `check(mac)` のみだった。この広がりは許容する
    #   (mac の運用前提が守られていれば稀であり、hosted outage の方が発生時の影響が
    #   大きく気づきにくいため)。
    # ⚠️ トレードオフ 2 (security-checker / code-reviewer 指摘, 2026-08-26): `gse-mac` の
    #   runner スロットは実機 1 台 (1 同時実行) しかなく、`check(mac-selfhosted)` (最大30分)
    #   / `build-macos` (最大40分) と**同じスロットを奪い合う**。別ブランチの run が並走中だと、
    #   本ジョブは offline でなくても busy でキューに並び、最大その分だけ開始が遅れる
    #   (ただし check/build 側に timeout-minutes があるため上限は有限で、offline/スリープ時の
    #   24-48h 滞留とは性質が異なる)。従来 win レグの起動は mac の状態と完全に独立だったが、
    #   本変更後は mac のビルド時間に律速されうる。
    #   → ★ 恒久対策は `gse-mac` に probe 専用の別ラベル runner (例 `gse-mac-probe`) を
    #   追加登録すること。物理マシンへのアクセスが要るため本変更の範囲外とし、
    #   `.steering/20260827-main-ci-push-event-missing/design.md` に follow-up として記録する。
    runs-on: [self-hosted, gse-mac]
    timeout-minutes: 5
    outputs:
      runs_on: ${{ steps.probe.outputs.runs_on }}
    steps:
      - name: Probe self-hosted Windows runner (max 30s, fail-safe to hosted)
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -uo pipefail
          HOSTED='["windows-latest"]'
          SELF='["self-hosted","gse-win"]'

          decide() {
            echo "runs_on=$1" >> "$GITHUB_OUTPUT"
            echo "resolved runs-on = $1"
            exit 0
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::RUNNER_STATUS_TOKEN is unset -> hosted (fail-safe)"
            decide "$HOSTED"
          fi

          # ⚠️★★★ self-hosted 化 (2026-08-26) で追加: `gh`/`jq` は macOS に同梱されないため
          #   `gse-mac` 実機での導入有無は未検証。下の probe ループは `gh`/`jq` 不在でも
          #   `2>/dev/null || true` / `|| echo 0` で例外は出さず完走するが、**そのまま放置すると
          #   「online 判定できない」と「gse-win が実際に offline」の区別が付かないログになる**
          #   (code-reviewer 指摘: jq 不在時、判定不能なのに「30秒以内に online にならなかった」
          #   という事実と異なる notice が出る)。→ 原因を可視化してから即 fail-safe する。
          for t in gh jq; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "::warning::$t not found on probe runner (${RUNNER_NAME:-unknown}) -> hosted (fail-safe)"
              decide "$HOSTED"
            fi
          done

          # 5s x 6 = 最大 30s。★ 起き上がりかけを拾うためポーリングにしている。
          for i in 1 2 3 4 5 6; do
            body="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" 2>/dev/null || true)"
            if [ -n "$body" ]; then
              online="$(printf '%s' "$body" \
                | jq -r '[.runners[] | select(.status=="online" and (any(.labels[]; .name=="gse-win")))] | length' \
                2>/dev/null || echo 0)"
              if [ "${online:-0}" -gt 0 ]; then
                echo "::notice::gse-win runner is online (attempt ${i}) -> self-hosted"
                decide "$SELF"
              fi
            else
              echo "::warning::runner status API call failed (attempt ${i})"
            fi
            if [ "$i" -lt 6 ]; then sleep 5; fi
          done

          echo "::notice::gse-win did not come online within 30s -> hosted (fallback)"
          decide "$HOSTED"

  check:
    # ★ 手動発火では走らせない (self-hosted の macOS ランナーが offline だとキューへ滞留するため。
    #   手動発火の目的は Windows の exe を 1 個作ることだけである)。
    # ⚠️★★★ 2026-08-26 追加: `decide-win-runner` を self-hosted 化した副作用として、その
    #   ジョブが「失敗」する経路が新たに生まれた (hosted VM は使い捨てなので実質失敗しな
    #   かったが、self-hosted 実機はジョブ中に接続が切れて failure になりうる)。デフォルトの
    #   `needs:` 挙動 (暗黙の success() 要求) のままだと `decide-win-runner` failure で
    #   `check` が win/mac 両方 skip され CI シグナルが消える。`!cancelled()` にして
    #   failure でも走らせ、下の runs-on 側で出力欠落を hosted へフォールバックする
    #   (code-reviewer 指摘、2026-08-26)。
    # ⚠️ 末尾の 2 行は外部 fork 遮断 (env 直下の注記を参照)。★ 両レグとも self-hosted 実機で走る。
    if: >-
      ${{ !cancelled() && github.event_name != 'workflow_dispatch'
          && !startsWith(github.ref, 'refs/tags/')
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    # ⚠️ mac 側も decide の完了を待つ (最大 30 秒)。両 OS を 1 matrix に保つための代償。
    needs: decide-win-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: gse-win-selfhosted
            target: x86_64-pc-windows-msvc
          - runner: gse-mac-selfhosted
            target: aarch64-apple-darwin
    # ⚠️ matrix が 2 本である前提の三項式。★ 3 本目を足すときはここを必ず書き換えること。
    # ⚠️ `|| '["windows-latest"]'` は decide-win-runner が failure/skip で outputs.runs_on を
    #   一度も書けなかった場合のフォールバック (空文字列は fromJSON に渡すと失敗するため)。
    runs-on: ${{ matrix.runner == 'gse-mac-selfhosted' && fromJSON('["self-hosted","gse-mac"]') || fromJSON(needs.decide-win-runner.outputs.runs_on || '["windows-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # ⚠️★★★ 2026-09-12 (R-4): `cargo test` (下方) の **env 前提** を、job の先頭で検査する。
      #
      # ★ なぜ要るか: `redact_home_path_masks_real_home_from_env` は
      #   **env (`USERPROFILE` / `HOME`) を読む経路**の回帰保護であり、そこが壊れると
      #   ⚠️ 被験者に見せる提出失敗メッセージへ **OS ユーザー名を含むフルパスが素通り**する。
      #   ⚠️ 従来このテストは env が取れないと**無音で skip** しており、CI ログでは
      #   「通った」と「skip した」が**区別できなかった** (= 見えないまま緑)。
      #   → ★ テスト側は `panic!` に倒した。本 step はその前提を**先に・単独で**鳴らす。
      #   ★ job の先頭に置くのは、⚠️ 前提が崩れているときに **数分のフルビルドを消費してから
      #   落ちる**のを避けるため (★ `timeout-minutes: 30`)。
      #
      # ⚠️★★★ **`env:` で HOME / USERPROFILE を上書きしてはならない。**
      #   ★ `CARGO_HOME` / `RUSTUP_HOME` の既定は `$HOME/.cargo` / `$HOME/.rustup` なので、
      #   `HOME` を差し替えると **self-hosted mac が toolchain を丸ごと再取得**し、
      #   ディスクガード (threshold=15GiB) を直撃する。★ しかも自分で立てた値を観測しても
      #   「実機に立っているか」という当の問いの答えにならない。→ **検査だけする。**
      #
      # ⚠️★★★ **Windows で `HOME` を見てはならない (★ 2026-09-12 に実測)。**
      #   ★ `cargo test` step は `shell:` 未指定 (`defaults:` ブロックも無い) なので
      #   **Windows では pwsh・macOS では bash** で走る。
      #   ⚠️ ところが **pwsh → git-bash で起動すると MSYS2 ランタイムが `HOME` を合成する**:
      #   Windows 側に `HOME` / `USERPROFILE` / `HOMEDRIVE` / `HOMEPATH` が **1 つも無くても**、
      #   git-bash の中では `HOME=/c/Users/<user>` が見える (★ 本機で再現済み)。
      #   → ⚠️★★★ bash で `HOME` を検査すると **Windows レグでは構造的に失敗しえない**
      #   (= **検査が空振り**。★ まさに本 step が潰そうとしている欠陥クラスそのもの)。
      #   ★ 一方 **`USERPROFILE` は合成されない** (★ 同じ実測で `unset` のままだった) ので、
      #   **Windows の判定は `USERPROFILE` だけで行う** —— ⚠️ これが pwsh 側の実態と一致する。
      #   ★ macOS は `cargo test` も bash なので、bash での観測がそのまま忠実である。
      #
      #   ⚠️★★★ **「Windows で HOME を見ない」は *この bash step の話* であって、
      #   Rust テスト側の話ではない** (★ cross-review 指摘への回答・2026-09-12)。
      #   ★ テスト本体は `["USERPROFILE", "HOME"]` の順で読み、**OS 分岐しない**。それでよい ——
      #   ⚠️ 合成が起きるのは **git-bash の中だけ**で、pwsh から起動される `cargo test` は
      #   合成されない素の env を見るからである。★ 開発者が git-bash から `cargo test` を
      #   回した場合は合成 `HOME` を拾うが、⚠️ それは**実在するホームの値**なので検査は成立する。
      #   → ★ **テスト側に OS 分岐を足さないこと** (⚠️ 足すと本物の env 経路を検査しなくなる)。
      #
      #   ⚠️ **却下案: Windows だけ `shell: pwsh` にする** —— ★ 観測は最も忠実になるが、
      #   `pwsh` (PowerShell **Core**) は self-hosted 実機で WindowsApps 経由の導入であり、
      #   ⚠️ **ランナーサービスの PATH で解決できるかが未検証**。★ ci.yml に前例も無い。
      #   → ★ 実績のある `shell: bash` (ci.yml 内に Windows レグでの前例あり) を保ち、
      #   **見る変数の側を正す**方を採った。
      #
      # ⚠️ **値は絶対に出力しない** —— ★ 値には OS ユーザー名が入る。
      #   それは**まさに `redact_home_path` が伏せている当の情報**である
      #   (★ 根拠は `data-privacy` Skill ＋ 当該テストの doc コメント。
      #    ⚠️ ルール 7 は**非打鍵チャネルの凍結表**であって env 由来のパスは射程外なので引かない)。
      #   ⚠️★★★ **GitHub Actions のログマスクは当てにできない** —— ★ マスクが効くのは
      #   登録済み secret と `::add-mask::` だけで、`USERPROFILE` / `HOME` は secret ではない。
      #   → ★ 「出さない」ことが唯一の防御であり、set / unset の別だけを出す。
      #   ⚠️ `${VAR:+set}${VAR:-unset}` という「三項演算子もどき」を使わないこと ——
      #   ★ **set のときに `${VAR:-unset}` が値そのものを展開する** (2026-09-12 に初稿で踏んだ)。
      - name: Env precondition for redact_home_path test (R-4)
        shell: bash
        env:
          # ★ `runner.os` を bash へ直接展開せず `env:` 経由で渡す
          #   (⚠️ ci.yml L375 付近の既存 step と同じ作法)。
          GSE_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [ "${GSE_RUNNER_OS:-}" = "Windows" ]; then
            # ⚠️ HOME は git-bash が合成するので見ない (上の注記)。
            if [ -z "${USERPROFILE:-}" ]; then
              echo "::error title=env precondition::USERPROFILE が未設定です。redact_home_path の env 経路テストが前提を失います。"
              exit 1
            fi
            echo "USERPROFILE: set"
          else
            if [ -z "${USERPROFILE:-}" ] && [ -z "${HOME:-}" ]; then
              echo "::error title=env precondition::USERPROFILE / HOME がどちらも未設定です。redact_home_path の env 経路テストが前提を失います。"
              exit 1
            fi
            # ⚠️★★★ 値は出さない (OS ユーザー名を含むため)。
            #   ★ `${VAR:-unset}` と書くと **set のときに値そのものが出る**ので使わない。
            if [ -n "${USERPROFILE:-}" ]; then echo "USERPROFILE: set"; else echo "USERPROFILE: unset"; fi
            if [ -n "${HOME:-}" ]; then echo "HOME: set"; else echo "HOME: unset"; fi
          fi
      # ⚠️★★★ **toolchain は `rust-toolchain.toml` (repo 直下) が決める** (R-2・2026-09-12)。
      #   ★ ここが**正典の説明**。⚠️ `build-windows` / `build-macos` は 1 行でここを参照する
      #   (★ 同じ 8 行を 3 箇所へ複製すると、必ず片方だけ直る —— disk-guard を composite action へ
      #   切り出したときの教訓と同型)。
      #
      #   ★ repo 直下のファイルは **サブディレクトリでも効く** (rustup は cwd から上へ辿る) ので、
      #   `working-directory: src-tauri` の cargo step も、`npx tauri build` が内部で起動する
      #   cargo も、**すべてファイルが指す版**で走る。
      #   ⚠️ 下の `@stable` に残る役割は **「`stable` を入れて `rustup default` に据えること」**
      #   だけである (★ 実測: `~/.rustup/settings.toml` に
      #   `default_toolchain = "stable-x86_64-pc-windows-msvc"` が実在する)。
      #   ⚠️★ **「rustup そのものを用意する」とは書かない** —— ★ action が rustup を導入するか
      #   どうかの一次資料を取れていないうえ、hosted には同梱・self-hosted には既に在るので、
      #   **実態より強い保証を謳うことになる**。
      #   ⚠️ **`@stable` を `@<version>` に変えないこと** —— ★ 版番号が ci.yml 3 箇所 ＋
      #   `rust-toolchain.toml` の計 4 箇所に分散し、版上げで**黙って食い違う**。
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable ブランチ 2026-09-03
        with:
          targets: ${{ matrix.target }}
          components: clippy
      # ⚠️★★★ **固定版を「明示的に」入れる** (★ code review HIGH ×3 をまとめて閉じる・2026-09-12)。
      #
      #   ★ 逐語 (`rustup toolchain install --help`):
      #   「Install or update the given toolchains, **or by default the active toolchain**」
      #   → ⚠️ 引数なしで **`rust-toolchain.toml` が指す版を `profile` / `components` 込みで**入れる。
      #
      #   ⚠️ なぜ「最初の cargo 呼び出しでの暗黙 auto-install」に任せないか:
      #   1. ★ auto-install の成否は **各実機の rustup の版と設定に依存**する。
      #      ⚠️ `gse-mac` の rustup 版は**一度も測っていない**。無効なら **全 step の手前で赤**になる。
      #   2. ⚠️★★★ **暗黙 DL は下のディスクガードより *後* に起きる。**
      #      → ★ guard の `free before:` が **DL 前の数字**になり、**測りたい増分を測る前に測る**
      #      ことになる (⚠️ 実効 floor / threshold がその分ズレる)。→ **guard より前に置く。**
      #   3. ⚠️★★★ **固定が効いた証拠が run ログに 1 行も残らない。**
      #      ★ 従来 ci.yml に `rustc --version` を出す step は **0 件**だったので、
      #      「緑になった」だけでは **どの版で緑なのか判別できない** (= 見えないまま緑)。
      #      → ★ 下で `rustup show active-toolchain` を必ず出す。
      #   ⚠️★★★ **`--target` を明示する** (★ cross-review HIGH・2026-09-12)。
      #   ★ 上の `dtolnay` の `targets:` が入れるのは **stable 側にだけ**である。
      #   ⚠️ その後 cargo は固定版へ切り替わるので、**固定版の側に target std が無い**と
      #   `--target` が `can't find crate for core` で落ちる。
      #   ★ いまは **host == `matrix.target`** なので host std の同梱で足りているが
      #   (⚠️ CI ログで実測済み: win=`x86_64-pc-windows-msvc` / mac=`aarch64-apple-darwin`)、
      #   ⚠️ **それはコメントに書いてあるだけの不変条件**だった。→ ★ **step 側で強制する。**
      #   ★ これは決定 3 (ファイルに `targets` を書かない) と矛盾しない ——
      #   ⚠️ ファイルに書くと**相手 OS の std を両機に入れる**が、ここはレグごとに 1 つだけ入る。
      - name: Install pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          # ★ toolchain 名は渡さない (= active toolchain = 固定版) が、target は明示する。
          # ⚠️★★★ `--no-self-update` を付ける (★ 2026-09-12 に実行して副作用を見つけた) ——
          #   この step は既定で **rustup 自身を self-update する** (実測: 1.29.0 → 1.29.1 を
          #   ダウンロードし始めた)。⚠️ self-hosted 実機のツールを**黙って書き換える**うえ、
          #   ★ 所要時間が読めなくなる (= `timeout-minutes` の見積もりが揺れる)。
          #   → ⚠️ rustup の更新は**意図して別途行う**。CI の副作用でやらない。
          rustup toolchain install --no-self-update --target "${{ matrix.target }}"
          echo "--- 固定が効いていることの証拠 (⚠️ 版上げ PR の受け入れ証拠にもなる) ---"
          rustup show active-toolchain
          cargo --version
          cargo clippy --version
          rustup target list --installed
      # ★ 2026-08-31 追加: ディスク枯渇ガード (self-hosted mac 専用)。
      #
      # ⚠️ なぜ要るか: PR #135 (ドキュメントのみ・コード差分ゼロ) の check が
      #   `failed to build archive ... No space left on device (os error 28)` で落ちた。
      #   原因は変更内容ではなく **ランナー実機の空き容量** (当時 424MiB)。
      #   Windows 側は同じコードで SUCCESS しており、mac 実機だけの問題だった。
      #
      # ★ self-hosted は GitHub-hosted と違い **workspace が永続する**。使い捨て VM なら
      #   ジョブごとに消える target が、実機では**誰かが手で消すまで減らない**。
      #   実測で runner 側 2.7G / 同一マシンのローカルクローン側 31G まで肥大していた。
      #
      # ⚠️ この step は toolchain の後・rust-cache の前に置くこと。cargo-sweep の呼び出しに
      #   cargo が要る一方、キャッシュ復元自体も空き容量を食うため、その前に空けておく必要がある。
      #
      # ★ 2026-08-31 (第 2 版): 実体を `.github/actions/disk-guard` へ移した。
      #   ⚠️ 初版は本ジョブに直書きで、**`build-macos` に掛かっていなかった** (code-reviewer 指摘 #1)。
      # ⚠️★★ **`gse-win` レグには掛けていない** —— ★ 根拠を書く (code-reviewer 指摘, 2026-08-31)。
      #   ⚠️ 「self-hosted なのに片方だけ守られている」のは指摘 #1 と同じ構図なので、
      #   **根拠の無い除外を残さない**ために理由を明示する:
      #   (1) 枯渇の実測があるのは **mac 側だけ**である (PR #135 / 424MiB)。win 側の空き容量は
      #       **一度も測っていない**。→ ★ 閾値を推測で置かない。
      #   (2) ⚠️ 私の手元 (macOS) では **Windows レグを 1 行も実行できない**
      #       (memory `windows-only-code-needs-ci`)。`df -Pk` / `rm -rf` は git-bash なら動く
      #       はずだが、**「はず」で fail-closed のガードを入れると CI ごと止まりうる**。
      #   → ★ follow-up: gse-win の空き容量を実測してから同じガードを掛ける
      #     (`.steering/20260831-ci-guard-review-fixes/tasklist.md`)。
      - name: Disk guard (self-hosted only)
        id: disk_guard
        if: ${{ matrix.runner == 'gse-mac-selfhosted' }}
        uses: ./.github/actions/disk-guard
      # ⚠️★★★ `if:` を付けた理由 (code-reviewer 指摘 #2, 2026-08-31):
      #   初版は `rm -rf src-tauri/target` の**直後に本 step がキャッシュを復元**していたため、
      #   ガードが謳う「フルビルドに倒す」が成立していなかった (捨てた target が即座に戻る)。
      #   ★ floor が発火したときはキャッシュ復元ごと飛ばす。
      #   ⚠️ mac 以外のレグでは disk_guard 自体が skip され、outputs は **`null`** になる
      #     (★ 初版の注記は「空文字」と書いていたが正確には null。結論は同じ)。
      #     `null != 'true'` は真 = 従来どおり復元される (Windows レグの挙動は不変)。
      # ⚠️★ **保存 (post ステップ) も一緒に飛ぶ**。★ これは意図どおりである:
      #   wipe した run のフルビルド結果はキャッシュされず、次回は wipe 前の古いキャッシュが
      #   復元される。⚠️ 「バグだ」と思って `if:` を消さないこと。キャッシュの更新は
      #   頻繁に走る通常の run が担う。
      # ⚠️★★★ 2026-09-02 追加: **self-hosted では rust-cache を回さない**。
      #
      # ⚠️ なぜ要るか (実測。`.steering/20260902-ci-cache-timeout-selfhosted/requirement.md`):
      #   PR #143 の win / PR #144 の mac が `cancelled` になった。★ 原因はコードではない ——
      #   **実作業 (build / test / snapshot / schema drift) は全ステップ success** で 3m33s〜6m00s。
      #   落ちたのは post ステップのキャッシュ保存だけである:
      #     1. 本 action が `Cache hit for: v0-rust-...` を出す
      #     2. ⚠️ ダウンロードが **0.0〜0.6 MB/s** に落ち、578MB を引き切れず `No cache found.` で諦める
      #     3. → 復元失敗なので本 action は「保存が必要」と判断する
      #     4. ⚠️ **578〜730MB を 0.0〜0.1 MB/s でアップロード**し 16〜21 分かかる
      #     5. `timeout-minutes: 30` に当たり **job ごと cancel**
      #   ★ #143 と #144(win) の明暗を分けたのは**復元にかかった時間の差だけ**で、コード差ではない。
      #   ⚠️ つまり緑赤がコイントスになっていた。
      #
      # ★ なぜ「無効化」で損をしないか: **self-hosted は workspace が永続する** (L275-276 の注記)。
      #   実測で runner 側 `src-tauri/target` は 2.1GB あり、09-02 付の `.rlib` が 237 個あった。
      #   ⚠️ 09-02 は復元が**全 job で失敗した**のに `cargo build` は 1m48s〜3m06s で終わっている
      #   → ★ 速さの出所はキャッシュではなく永続 `target/` である。キャッシュは利得が重複しており、
      #   **失敗したときのコストだけが残る**。
      #   ⚠️ 「キャッシュは常に無意味だった」とは書かない —— ★ 08-30 / 08-31 の run では
      #   `Cache restored successfully` が実際に出ている。壊れたのは 09-02 の転送速度低下が引き金。
      #
      # ⚠️★★ **`matrix.runner` で分岐してはいけない**: `decide-win-runner` が `windows-latest` へ
      #   フォールバックしても `matrix.runner` は `gse-win-selfhosted` のままなので、
      #   **hosted へ落ちた run のキャッシュまで殺してしまう**。
      #   → ★ `runner.environment` は**割り当て後のランナー上で評価される**ので追随する。
      # ★ fail-safe の向き: 値が空でも `'' == 'github-hosted'` は false = キャッシュ無効側に倒れる。
      #   self-hosted (常用経路) では望む挙動であり、hosted (稀) が利得を失うだけで壊れはしない。
      # ⚠️ ただし「倒れる向きが安全」は「値が正しい」の代わりにならない → 下の step でログに出す。
      #
      # ⚠️★★ **hosted フォールバック経路は初回コールドになる** (code-reviewer 指摘, 2026-09-02)。
      #   ★ `...-check-...` の鍵を**書いていたのは self-hosted の run** であり、その書き手が消える。
      #   ⚠️ さらに rust 系キャッシュは 2026-09-02 に全削除済み (10.56GB → 1.13GB)。
      #   → ★ G-GEAR offline 時の緊急経路 (`windows-latest`) は **初回だけコールド**になる
      #     (⚠️ hosted run 自身は `save-if` 既定 true なので保存し、2 回目以降は温まる)。
      #   ⚠️ **その初回が `timeout-minutes: 30` に収まるかは未測定である**
      #     (★ 参考値: hosted の cold `tauri build --no-bundle` が 12m09s、tools が 9m42s)。
      #   → ★ 発火は稀 (G-GEAR が落ちているときだけ) なので許容し、実測されたら見直す。
      # ⚠️ `${{ }}` を bash へ直接展開せず `env:` 経由で渡す (security-checker 指摘, 2026-09-02)。
      #   ★ `runner.environment` は PR の内容から操作できない (`env:` / `with:` で `runner.*`
      #   コンテキストを上書きすることはできない) ので**脆弱性ではない**が、
      #   `.github/actions/disk-guard/action.yml` が既に `env:` マッピングに統一しており、
      #   ⚠️ **同じ repo で防御の書き方を非対称にしない**。
      # ★ `runner.name` は出さない —— ⚠️ GitHub 自身が全 self-hosted job のログ 2 行目で
      #   `Runner name: '...'` を無条件に出しており、REST API も `runner_name` を返す。
      #   ★ 重複して出す利得が無い。
      - name: Cache decision (runner.environment を証拠として残す)
        shell: bash
        env:
          RUNNER_ENV: ${{ runner.environment }}
          DISK_GUARD_WIPED: ${{ steps.disk_guard.outputs.wiped }}
        run: |
          echo "runner.environment      = ${RUNNER_ENV}"
          echo "disk_guard.outputs.wiped = ${DISK_GUARD_WIPED:-(null: guard は skip された)}"
          echo "→ rust-cache が走るのは wiped != 'true' かつ runner.environment == 'github-hosted' のときだけ"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ steps.disk_guard.outputs.wiped != 'true' && runner.environment == 'github-hosted' }}
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Cargo build (${{ matrix.target }})
        run: cargo build --target ${{ matrix.target }}
        working-directory: src-tauri
      - name: Cargo test --workspace (--features package)
        run: cargo test --features package --workspace --target ${{ matrix.target }}
        working-directory: src-tauri
      - name: Snapshot regression (gse-replay --snapshot)
        run: cargo run --bin gse-replay --target ${{ matrix.target }} -- tests/fixtures/minimal.ndjson --snapshot tests/snapshots/minimal.json
        working-directory: src-tauri
      # Schema drift check (Phase 1 dataset-repo-setup):
      # schema_dto.rs から emit_schema で再生成した JSON Schema が
      # コミット済み schema/current.json と一致することを保証する。
      # drift があれば CI FAIL し、gse-dataset 側同期が必要と通知される。
      - name: Schema drift check (NDJSON JSON Schema)
        shell: bash
        run: |
          cargo run --bin emit_schema --target ${{ matrix.target }} > /tmp/emitted-schema.json
          diff -u schema/current.json /tmp/emitted-schema.json
        working-directory: src-tauri
      # ★ 2026-09-12 追加: clippy ゲート (引き継ぎ R-1)。
      #
      # ⚠️★★★ **なぜ今まで無かったのに今足せるのか**: 2026-09-12 に Windows 側 51 件 /
      #   mac 側 7 件を潰して**両 OS が exit 0 になったから**である。⚠️ 赤のまま足すと
      #   main の CI が即赤になり全作業が止まる (★ 足す順序そのものが受け入れ条件だった)。
      #
      # ⚠️★★★ **`--all-targets` を落とさないこと**。★ 落とすと `#[cfg(test)]` が
      #   **一切解析されない** (2026-09-12 に実測: Windows 側で `features.rs` と同じ lint が
      #   `probe_scheduler.rs` のテストに生き残っていた)。
      #   ⚠️★★★ **ローカル gate (`.claude/hooks/stop-check.sh`) と同一ではない。**
      #   ★ 揃っているのは `--all-targets -D warnings` までで、⚠️ **`--features package` は
      #   CI 側にしか無い** (ローカルは毎 Stop で走るので age / reqwest の再解析を載せない)。
      #   → ★ したがって `reconcile.rs` / `packaging.rs` の lint は **CI で初めて赤くなる**。
      #     ⚠️ 「手元が緑だから CI も緑」と読まないこと (code-reviewer 指摘, 2026-09-12)。
      #
      # ⚠️★★★ **`--features package` を落とさないこと**。★ 上の `cargo test` step と同じ理由で、
      #   落とすと `reconcile.rs` / `packaging.rs` (= O1 の「48 時間の猶予」を守る当の機構) が
      #   **lint の外に出る**。⚠️ 「見えないまま緑」を作らない。
      #
      # ★ 位置は最後 —— ⚠️ ビルド / テスト / ゴールデン / schema の**既存シグナルの順序を変えない**
      #   ため (lint は新しく足した門なので、先に既存の門を鳴らす)。
      - name: Clippy (-D warnings, --all-targets)
        run: cargo clippy --all-targets --features package --target ${{ matrix.target }} -- -D warnings
        working-directory: src-tauri
      # ⚠️★★★ Loop 基盤の deny 注入を **Windows(git-bash) でも走らせる** (2026-09-14)。
      #   ★ なぜ ubuntu だけでは足りないか: `scripts/loop-worktree-deny.sh` は
      #     **git-bash の jq が CRLF を出す**という OS 固有の回避を持つ (2026-09-14 に実測)。
      #     ⚠️ そこが退行しても ubuntu の同じテストは緑のままである
      #     (`docs/agent-shared.md` 逐語「OS ごとに規則が違うロジックは両 OS に対のテストを置く」)。
      #   ⚠️★★ macOS 側では走らせていない —— ★ 理由は **self-hosted の gse-mac に jq が
      #     入っているか未検証**だから (`ci.yml` 上方の probe ループが同じ前提を置いている)。
      #     ★ テストは jq 不在で `exit 2`(＝ 判定しない) になるため、CI では赤に見える。
      #     → ⚠️ **「macOS は検証していない」ことを隠さない。** jq を確認できたら条件を外す。
      # ⚠️ 条件は **runner 名ではなく OS** で書く（★ Codex /cross-review LOW・2026-09-14）——
      #   ★ `matrix.runner == 'gse-win-selfhosted'` だと、runner 名を変えた瞬間に
      #     **静かに未実行**になる（⚠️ 緑のまま検査が消える形）。
      - name: Loop worktree deny gate (Windows・git-bash の jq が CRLF を出すため)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/loop-worktree-deny-test.sh
      # ⚠️★★★ Loop 基盤の**境界**の検査 (2026-09-20 追加・起票 10 / 3 / 判断 26 の申し送り)。
      #   ★ deny は多層防御でしかない (⚠️ `git -C . checkout` が通ることを実測した)。
      #     **境界は `loop-run.sh` の `ensure_branch`** であり、ここが退行すると
      #     ⚠️ **別ブランチを verify して緑/赤を出す**事故に戻る。
      - name: Loop run guard gate (Windows・ブランチ検査 / Status フィルタ / denials 内訳)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/loop-run-guard-test.sh
      # ⚠️★★★ Loop 基盤の**後始末**の検査 (2026-09-21 追加・起票 18)。
      #   ★ `--cleanup` は worktree を **ブランチ名だけ**で引いていたので、逸脱した worktree を
      #     撤去できないまま **`cleanup 完了` / exit 0** を返していた (★ 2026-09-20 に実測)。
      #   ⚠️ Windows でも走らせる理由: ★ **`git worktree list` は `C:/...` を、bash の `pwd` は
      #     `/c/...` を返す** (2026-09-21 に git-bash で実測)。★ 撤去の事後確認をフルパスで
      #     書き直すと ubuntu では緑のまま Windows だけ壊れる ——
      #     `docs/agent-shared.md` 逐語「OS ごとに規則が違うロジックは両 OS に対のテストを置く」。
      #   ★ **macOS には配線していない**。⚠️ 隣の deny gate とは**理由が違う**ので書き分ける ——
      #     deny gate は「self-hosted の gse-mac に jq があるか未検証」だが、
      #     ★ 本テストは **jq を要らない**（`loop-spawn-cleanup-test.sh` が deny 注入を stub にしている）。
      #     ★ 本テストで OS 依存なのは**パス表記**（`C:/…` ⇄ `/c/…`）だけで、
      #     ⚠️ macOS は ubuntu と同じ POSIX 表記なので **ubuntu 側の実行で覆われる**。
      #     → ★ macOS 固有の規則を足したら、そのときに配線すること。
      - name: Loop spawn cleanup gate (Windows・逸脱 worktree の撤去 / 嘘の完了報告)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/loop-spawn-cleanup-test.sh

  # ── ブランチ push / PR: Frontend 型検査 + Vite ビルド ─────────
  frontend-check:
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
    # ⚠️★★★ 最小権限を明記する (2026-09-11・security-checker MEDIUM)。
    #   ★ この job は `pip install python-pptx` / `duckdb` で **PyPI の任意コードを実行する**。
    #   ⚠️ job レベルの permissions が無いと、リポジトリ既定の GITHUB_TOKEN 権限が
    #     そのまま渡る (既定が read/write なら CI から repo へ push できてしまう)。
    #   ★ trigger は pull_request (pull_request_target ではない) なので fork PR に
    #     secrets は渡らないが、**既定に依存しない**ことを明示する。
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Vite production build
        run: npm run build
      # ★ PreReg-1 ビネット構成の機械検査 (禁止語 / 隣接象限 / 均等配置 / 不透明 ID)。
      #   ⚠️ 均等配置 (4 象限 ×2 問) が崩れると straight-lining の一致上限 2/8 が
      #   保証されなくなり、`notes.md` §4 で実測された定数回答が 6/8 を通り抜けうる。
      #   → 合格条件と同じ重さで CI に置く。
      #   ⚠️ `--self-test` を先に走らせ、検査自体が空振り (常に緑) でないことを確かめる。
      - name: Vignette self-test (検査が H0 偽で赤になるか)
        run: python3 scripts/check_vignettes.py --self-test
        env:
          PYTHONUTF8: "1"
      - name: Vignette structure check (PreReg-1)
        run: python3 scripts/check_vignettes.py
        env:
          PYTHONUTF8: "1"
      # ⚠️★★★ ADR-013 Migration 4: 解析の前処理ゲート (capabilities の機械判定)。
      #   ★ 「計器がコホートを跨げなかった」失敗が 2 件起きており、ADR-013 自身の診断は
      #     「規約は書いてあったのに適用しなかった」である。→ 検査を**コードにした**以上、
      #     ⚠️ その検査が空振りしていないことを CI で担保する。
      #   ⚠️ 生ログは CI に無いので、走らせるのは `--self-test` と単体テストだけである。
      - name: Capabilities gate self-test (検査が空振りしていないか)
        run: python3 scripts/capabilities_gate.py --self-test
        env:
          PYTHONUTF8: "1"
      - name: Capabilities gate unit tests (ADR-013 判定表)
        run: python3 -m unittest scripts.tests.test_capabilities_gate
        env:
          PYTHONUTF8: "1"
      # ⚠️★★★ シェル移植性ゲート (bash 3.2 の変数名パース)。
      #   ★ macOS 標準の bash は 3.2 で、**多バイト文字を変数名の一部として読む**。
      #     → 括らずに書いた変数の直後に全角括弧が来ると `set -u` で落ちる。
      #   ⚠️ 実害: `scripts/sync-session.sh` の **O1 ガードが `exit 4` に到達できず `exit 1`**
      #     を返していた (2026-08-29 に macOS 実機で実測)。★ O1 セッションを gse-dataset へ
      #     出さない番人であり、`docs/o1-deletion-ledger.md` §4 の約束を支えている。
      #   ⚠️★ **1 箇所ずつ直す方式は効かなかった**: 罠を踏んだ実測コメントが既にあったのに、
      #     リポジトリ全体では 17 箇所生きていた。→ 機械で見張る。
      #   ★ 陽性/陰性対照を内蔵しているので、このステップだけで
      #     「検査が空振りしていないこと」まで見る (上の 2 つの --self-test と同じ思想)。
      - name: Shell portability gate (bash 3.2 の変数名パース・対照つき)
        run: bash scripts/check-shell-portability.sh
      # ⚠️★★★ `--features` 出力の共有の門 (2026-09-20 追加・起票 5)。
      #   ★ 規約は前から在った —— `docs/glossary.md` の「特徴行」に逐語
      #     「中間成果物であり gse-dataset へは共有しない」。
      #   ⚠️ しかし **機械的な門が無かった** (2026-09-15 実測): `feat.json` / `features.json` /
      #     `src-tauri/rows.json` / `experiments/x/feat.json` / `out.ndjson` は **すべて NOT ignored**。
      #   ⚠️★★★ `.gitignore` にファイル名を足すのは**名前依存なので代替にならない**
      #     (★ 起票 5 の逐語)。→ 中身で見る (マーカー ＋ 封筒を剥がした行の形の 2 本立て)。
      #   ⚠️ 実測: 初版の検査器は **陽性対照 P2 (剥がした行の配列) を通していた**
      #     (jq の `|` が `or` より弱く、2 本目の条件が元の文書を受けていなかった)。
      #     → ★ `--self-test` を**先に**走らせ、門が閉まることまで見る。
      #   ⚠️ この門が見ていないもの (リポジトリの外 / 圧縮済み / CSV・NDJSON 変換 /
      #     **gse-dataset 側のコミット**) は script 冒頭に列挙してある。
      - name: Feature-output sharing gate self-test (門が実際に閉まるか)
        run: bash scripts/check_no_feature_output.sh --self-test
      - name: Feature-output sharing gate (--features 出力をコミットしていないか)
        run: bash scripts/check_no_feature_output.sh
      # ⚠️★★★ Loop 基盤の安全装置 (2026-09-14 追加)。
      #   ★ 無人モードC は worktree の中で `claude -p` を回すので、**承認する人が居ない**。
      #     → ⚠️ `permissions.deny` が worktree に入っていないと `git push` / `gh pr merge` が通りうる。
      #   ⚠️ 実測 (2026-09-13) では **deny を worktree へ入れる仕組みが 1 つも無かった** (grep 0 件)。
      #   ★ このテストは 3 状態 (不在 / 正常 / 壊れている) と**陰性対照**を持ち、
      #     ⚠️ 「検査が空振りしていないこと」まで見る (★ 実際に一時 git repo で worktree を作る)。
      - name: Loop worktree deny gate (無人ループの worktree に deny が入るか)
        run: bash scripts/loop-worktree-deny-test.sh
      # ⚠️★★★ Loop 基盤の**境界** (2026-09-20 追加)。
      #   ★ 2026-09-15 に worker が `git checkout main` で worktree 隔離を自分で外した (起票 10)。
      #   ⚠️ deny を増やしても閉じない —— `git -C . checkout main` は **deny 9 件でも通る**
      #     (★ 2026-09-20 に実測。`.steering/20260920-loop-foundation-fixes/measurements.md` M3)。
      #   → ★ 境界は `ensure_branch`。この検査は B2 を**陰性対照**に持ち、
      #     ⚠️ 実装を殺すと実際に赤くなることを確認済み (突然変異 3 種)。
      - name: Loop run guard gate (ブランチ検査 / Status フィルタ / denials 内訳)
        run: bash scripts/loop-run-guard-test.sh
      # ⚠️★★★ Loop 基盤の**後始末** (2026-09-21 追加・起票 18)。
      #   ★ 2026-09-20 の実測: `--cleanup zzz` が「完了」と言ったのに worktree が残り、
      #     ⚠️ **同じ id の再実行が恒久的に死ぬ / main を checkout できなくなる**状態になった。
      #   ★ この検査は **変異テスト** (一致規則の path 系統を潰す) を持ち、
      #     ⚠️ 旧実装に当てると 10 件 NG になることを確認済み (2026-09-21)。
      - name: Loop spawn cleanup gate (逸脱 worktree の撤去 / 嘘の完了報告)
        run: bash scripts/loop-spawn-cleanup-test.sh
      # ⚠️★★★ secrets-filter のゲート (2026-09-10 追加)。
      #   ★ `scripts/secrets-filter.sh` は **git diff を外部 LLM (Codex) へ渡す前の最後の関門**で、
      #     `scripts/secrets-filter-test.sh` という対照つきのテストも**既にあった**。
      #   ⚠️ **なのに CI に 1 箇所も登録されていなかった** (2026-09-10 に grep で実測: 0 件)。
      #     → ★ 手で叩かない限り走らない ＝ 退行しても誰も気づかない。
      #   ⚠️ 実害の実測: main の filter は `.env.local` / `.pem.bak` / `.key.pub` /
      #     **引用符つき (非 ASCII 名) の `.env` `.pem` `.key` `.pptx`** /
      #     `diff --cc` / `Binary files` 行 を**素通り**させていた (新テストで 20 件以上が NG)。
      #     ★ 旧テストが 22 ケースしか見ていなかったので、**緑のまま穴が生きていた**。
      - name: Secrets filter gate (外部 LLM へ渡す diff の最後の関門)
        run: bash scripts/secrets-filter-test.sh
      # ⚠️★★★ **「テストは書いたが CI で走らない」を機械で見張る** (2026-09-10 追加)。
      #   ★ secrets-filter は例外ではなかった —— ⚠️ 同じ状態のテストが **8 本**あった (実測)。
      #   ★ 意図的に外すものは、check-tests-are-wired.sh の除外表に**理由つきで**書く。
      - name: Tests-are-wired self-test (検査が空振りしていないか)
        run: bash scripts/check-tests-are-wired.sh --self-test
      - name: Tests-are-wired gate (書いたテストが CI で走るか)
        run: bash scripts/check-tests-are-wired.sh
      # ⚠️★★★ 2026-09-10 追加。★ `check-tests-are-wired.sh` は **命名パターン**
      #   (`test_*.py` / `*_test.sh` / `*-test.sh`) しか見ないので、
      #   ⚠️ `--self-test` を内蔵した script は **番人に見えないまま CI をすり抜ける**。
      #   ★ 実際、これを足す直前に自分で踏んだ (★ 番人は緑 10/10 のまま新 script を見なかった)。
      #   → ★ この種の script は**ここに明示的に並べる**。
      - name: Collection continuity self-test (受領 NDJSON の静かな停止を捕まえるか)
        run: python3 scripts/check_collection_continuity.py --self-test
      # ⚠️★★ ここから下は 2026-09-10 まで **1 度も CI で走っていなかった** テスト群。
      #   ★ どれも手元では緑だったが、⚠️ **走っていないテストは緑とは言えない**。
      - name: O1 sync guard test (gse-dataset へ O1 を出さない番人)
        run: bash scripts/sync_session_o1_guard_test.sh
      - name: Participant id parity test (logger ⇄ sync scripts)
        run: bash scripts/tests/test_participant_id_parity.sh
      - name: G1 emails / submission tab / manifest tests
        run: |
          python3 -m unittest scripts.tests.test_check_g1_emails
          python3 -m unittest scripts.tests.test_g1_submission_tab
          python3 -m unittest scripts.tests.test_gen_sessions_manifest
        env:
          PYTHONUTF8: "1"
      - name: Schema parity test (gse-dataset 整合)
        run: python3 -m unittest scripts.tests.test_check_schema_parity
        env:
          PYTHONUTF8: "1"
      # ⚠️★★★ **supply-chain 検査器のテストはここでも走らせる** (F-1 / F-2・2026-09-12)。
      #   ★ `supply-chain.yml` にも配線してあるが、あちらは `paths:` 限定なので
      #   **依存や toolchain を触らない PR では 1 度も走らない**。
      #   ⚠️ 検査器が壊れたことに気づくのが「次に依存を触った日」では遅い。
      #   ★ ここは全 PR / push で走り、cargo-audit も network も要らない。
      - name: Supply-chain checker tests (F-1 / F-2)
        run: |
          python3 -m unittest scripts.tests.test_check_toolchain_advisories
          python3 -m unittest scripts.tests.test_check_dependency_audit
        env:
          PYTHONUTF8: "1"
      # ⚠️★★★ **workflow の不変条件ゲート** (F-8 / F-9・2026-09-13)。
      #   ★ 汎用 linter は入れない裁定 (⚠️ 第三者 action を増やすのは F-8 と逆行する)。
      #   ★ 代わりに**この repo が実際に決めたこと**を検査する:
      #     (1) 全 job が実効 `permissions` を持ち、⚠️ **広い権限を持たない** (F-5)
      #     (2) third-party action / reusable workflow / composite action 内の参照が
      #         **40 桁 commit SHA** で固定されている (F-8)
      #     (3) `supply-chain.yml` が **hosted であると証明できる** (★ 実機に鍵がある)
      #     (4) ⚠️ 走査 0 件は「違反なし」ではなく **exit 2**
      #   ⚠️★★ **走る範囲を正確に書く**: 本 job は `main` への PR と
      #     `main` / `feature/*` への push で走る。★ **tag push / 手動発火では走らない**
      #     (⚠️ つまり `softprops/action-gh-release` が実際に動く実行では検査されない) ——
      #     ただしマージ経路は PR を必ず通るので、main に入る前には必ず 1 度検査される。
      # ⚠️ PyYAML は ubuntu-latest 同梱の保証が取れなかったので明示的に入れる
      #   (★ 2026-09-13 の実測では在ったが、ランナーイメージは変わる)。
      - name: Install PyYAML (workflow invariants gate)
        run: python3 -m pip install --quiet "pyyaml==6.0.3"
      - name: Workflow invariants (F-8 / F-9)
        run: |
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          python3 scripts/check_workflow_invariants.py --self-test
          python3 scripts/check_workflow_invariants.py
          python3 -m unittest scripts.tests.test_check_workflow_invariants
        env:
          PYTHONUTF8: "1"
      # ⚠️★★★ **F-4 を「やらない」判断の担保** (2026-09-12)。
      #   ★ CI の clippy は `--features package` の **1 本だけ**である。
      #   ⚠️ default features のみの clippy が CI に無くてよいのは、
      #     **default スコープが package スコープの真部分集合**だからで、
      #     ★ それが成り立つ条件は「`cfg(not(feature = "package"))` が 0 件」の**1 点のみ**。
      #   → ⚠️ 人の記憶で守らない。**破れたら赤くする。**
      #
      # ★ 自己テストを**先に**置く (⚠️ `check_vignettes` 等と同じ作法) ——
      #   検査器が壊れていたら、本検査の緑は何も意味しないため。
      #   ⚠️ 自己テストには「**対象が 0 ファイルでも緑にしない**」対照が入っている。
      - name: Default-feature subset guard — self-test (F-4 の代替)
        run: python3 -m unittest scripts.tests.test_check_default_feature_subset
        env:
          PYTHONUTF8: "1"
      - name: Default-feature subset guard (F-4 の代替)
        run: python3 scripts/check_default_feature_subset.py
        env:
          PYTHONUTF8: "1"
      # ⚠️★★★ **duckdb を入れてから走らせる。** ★ 入れないと 16 件中 **15 件が skip** され
      #   (実測: `skipped 'duckdb not installed'`)、⚠️ **ほぼ何も検査しない緑**になる。
      #   ★ 入れた状態では 16 件すべて走って OK になることを手元で確認済み。
      - name: Install duckdb (⚠️ 無いと analysis-db テストが 15/16 skip する)
        run: python3 -m pip install --quiet duckdb
      - name: Analysis DB tests (⚠️ skip=0 で走ること)
        run: python3 -m unittest scripts.tests.test_build_analysis_db
        env:
          PYTHONUTF8: "1"
      # ⚠️★★★ 提出文書ゲート (2026-09-03 追加)。★ 3 つとも**手動実行だけに依存していた**。
      #   ⚠️ 実害の実測: `--compact` を落とすと詳細資料が **10 → 15 ページ**になるが、
      #     **本文は 1 文字も変わらない**ので diff を見ても気づけない。
      #     ★ 未踏の規約は 10 ページ以内で、超過は逐語「審査対象外」である。
      #   ⚠️ もう 1 件: SVG の `viewBox` 正規表現が `\\s` になっており **`.svg` を渡すと必ず落ちていた**
      #     (★ 提出物は `.png` 参照なので露見しなかった)。→ どちらも `--selftest` が見張る。
      #   ★ `--selftest` は変異体で落ちることを実測済み (余白を既定へ戻す / `viewBox` を旧 `\\s` へ戻す)
      #     ＝ 上の 3 つの self-test と同じ「検査が空振りしていないこと」まで見る思想。
      - name: md2docx selftest (--compact の退行と図の寸法)
        run: python3 scripts/md2docx.py --selftest
        env:
          PYTHONUTF8: "1"
      # ⚠️★★★ 2026-09-04 追加 (G-GEAR ブランチ由来)。★ `md2pptx.py` は同日に大きく変わった
      #   (テンプレート対応 / 図の埋め込み / 本物の表 / スライド単位のレイアウト / app.xml の補完) のに、
      #   **検査は手動実行だけに依存していた** —— 上の md2docx を CI に置いたのと同じ穴である。
      #   ★ selftest は**変異体 10 本**を実際に作って落ちることまで見る (版面の上書き復活 /
      #     見本スライドの残留 / 図の未埋め込み / 表の非テーブル化 / レイアウト単一化 /
      #     repo 外画像の素通り 等) ＝ 「検査が空振りしていないこと」まで見る思想。
      #   ⚠️ `scripts/` の中で外部依存を要するのは本スクリプトだけなので、ここでだけ入れる。
      - name: Install python-pptx (md2pptx selftest 用)
        run: python3 -m pip install --disable-pip-version-check "python-pptx==1.0.2"
      - name: md2pptx selftest (テンプレート・図・表・レイアウトの退行)
        run: python3 scripts/md2pptx.py --selftest
        env:
          PYTHONUTF8: "1"
      # ⚠️ 提出文書の禁止用語・装飾記号・撤回済み主張 (ADR-018 D7 / 研究者指示 / サーヴェイ)。
      #   ★ 出所: 2026-08-31 の cross-review で、廃止した段階呼称が 3 ファイルに残っていた。
      - name: Doc lexicon gate (禁止用語・装飾記号・撤回済み主張)
        run: python3 scripts/check_doc_lexicon.py
        env:
          PYTHONUTF8: "1"
      # ⚠️ 書誌 SSOT の append-only / 欠番 / 重複 key / tombstone 引用。
      #   ★ 実測: 2026-09-03 に Dhakal がコードと未踏文書で引用済みなのに `references.md` へ未登録だった。
      - name: Citation SSOT gate (append-only・欠番・重複 key)
        run: python3 scripts/check_citations.py
        env:
          PYTHONUTF8: "1"

  # ── タグ push: Windows ビルド ────────────────────────────────
  build-windows:
    # ★ タグ push (リリース) と、手動発火 (検証用ビルド) の両方で走る。
    #   ⚠️ `release` ジョブの `if` はタグ限定のままなので、★ 手動発火では
    #   **Release は作られない**。成果物は Actions の artifact (7 日) だけである。
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    # ★ 2026-08-15: `check` は self-hosted へ移したが、**本ジョブは hosted のまま**にする。
    #   理由: (a) タグ push / 手動発火でしか走らないので**恒常的な支出ではない**、
    #        (b) リリース成果物を作るジョブであり、⚠️ **G-GEAR が途中で落ちると
    #            リリースが壊れる**。割り当ては開始時に確定するのでフォールバックが効かない。
    #   → ★ 課金削減の効き目は毎 push の `check` 側にあり、そこだけを移すのが割に合う。
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # ⚠️ **toolchain は `rust-toolchain.toml` (repo 直下) が決める** (R-2)。
      #   ★ 説明の正典は `check` job の同名 step にある。⚠️ ここに複製しない。
      #   ★ 本 job で実際に cargo を起動する主経路は `npx tauri build` (cwd = repo 直下) だが、
      #   rustup は cwd から親へ辿るので**同じファイルが効く**。
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable ブランチ 2026-09-03
      # ★ 固定版を明示的に入れる (⚠️ 理由は `check` job の同名 step のコメント参照)。
      - name: Install pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          # ⚠️ `--no-self-update`: この step は既定で rustup 自身を self-update する (実測)。
          #   ★ self-hosted 実機のツールを黙って書き換えないこと (理由は `check` job の同名 step 参照)。
          # ★ target は指定しない —— 本 job は `--target` を渡さず host 向けに素で作るため。
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          # ★ タグ (リリース) ビルドではキャッシュを**保存しない**。
          # v0.1.22 で実害が出た: 成果物 (dmg / tools) は全部できていて ##[error] も 0 件なのに、
          # post ステップの `Failed to save: Unable to reserve cache with key ...` だけで
          # job が failure になり、release ジョブの macOS ダウンロード段
          # (`needs.build-macos.result == 'success'`) が弾かれて **dmg がリリースから落ちた**。
          # ⚠️ ここで release 側のゲートを緩めると「本当にビルドが壊れたとき」に
          #    部分的なリリースを黙って公開してしまうので、緩めるのは**保存側**にする。
          # 復元は従来どおり行うのでビルド時間は変わらない。
          # ⚠️★★★ **旧文はここに「キャッシュの更新は頻繁に走る check ジョブ (main / PR) が担う」
          #   と書いていたが、実測で誤りだった** (code-reviewer 指摘, 2026-09-02)。
          #   ★ rust-cache の鍵には **job id が入る** (`add-job-id-key: true` が既定) ので、
          #   `check` が書いた `...-check-...` の鍵は **`build-*` から一度も参照されない**。
          #   ⚠️ v0.1.30 の実測で本 action は build-macos 1 秒 / build-windows 3 秒＝
          #   **何も復元していない**。→ ★ 「check が更新を担う」という分業は成立していない。
          save-if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # リリースゲート: Windows の提出ツール (gse-submit.exe) も exe 隣の pubkey.txt を
      # recipient として使う (lib.rs:resolve_bundled_recipient のフォールバック元と同じ鍵ファイル)。
      # build-macos の同名ステップと同条件。★ workflow_dispatch (タグを切らない手動検証ビルド)
      # では走らせない — 手動発火の目的は exe を 1 個作ることだけで、リリース鍵の有無を問わない。
      - name: Verify researcher public key present (release gate)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ! grep -qE '^[[:space:]]*age1[0-9a-z]+' src-tauri/resources/pubkey.txt; then
            echo "::error::src-tauri/resources/pubkey.txt に 'age1...' 公開鍵行がありません。リリース前に研究者の実鍵を挿入してください (プレースホルダのままでは参加者が提出不能)。"
            exit 1
          fi
          echo "pubkey.txt OK (age1 line present)"
      - name: Build Tauri app
        # ★ インストーラ (NSIS) は作らない (2026-08-03)。Phase1 の実運用で被験者が使ったのは
        #   **ポータブル版 gse-next.exe** だけだった (Smart App Control の都合で
        #   docs/participant-setup-guide.md も portable を案内している)。
        #   インストーラを配ると「どちらを使うのか」が増えるだけで、実績が無い。
        #   ⚠️ ポータブル exe は cargo の成果物 (target/release/gse-next.exe) なので
        #      バンドラは不要。`--no-bundle` でフロントのビルドと cargo build までを行う。
        run: npx tauri build --no-bundle
      - name: Upload portable exe (SAC bypass)
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: src-tauri/target/release/gse-next.exe
          if-no-files-found: warn
          retention-days: 7
      # 提出/復号ツール（package feature。アプリ本体のビルドは --features package 非使用のため別途ビルド）。
      - name: Build submission/decrypt tools (package feature)
        working-directory: src-tauri
        run: cargo build --release --features package --bin gse-submit --bin gse-unpack
      - name: Upload Windows tools
        uses: actions/upload-artifact@v4
        with:
          name: windows-tools
          # ★ 被験者が使うのは gse-submit.exe だけ (アプリ内提出も 提出する_win.bat も
          #   これを exe と同階層に要求する)。gse-unpack.exe は**研究者専用の復号器**で、
          #   .app / インストーラから意図的に除外されているため Release が唯一の入手経路。
          #   ⚠️ gse-package.exe (手動フォールバック) は Phase1 で使われなかったので配らない。
          path: |
            src-tauri/target/release/gse-submit.exe
            src-tauri/target/release/gse-unpack.exe
          if-no-files-found: error
          retention-days: 7

  # ── タグ push: macOS ビルド ──────────────────────────────────
  build-macos:
    # ⚠️ fork 遮断の 2 行を足しているが、★ **現状これは冗長**である: `pull_request` イベントの
    #   `github.ref` は `refs/pull/N/merge` であって `refs/tags/v*` にならないので、本ジョブは
    #   もともと fork PR から到達しない。→ 到達経路が増えたとき (トリガー追加など) に
    #   **黙って無防備に戻らない**ようにするための明示であり、いま何かを塞いでいるのではない。
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v')
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    # Ad-hoc 署名 (APPLE_SIGNING_IDENTITY: "-") のため Developer 証明書に依存せず、
    # self-hosted へ移しても署名フローは変わらない。
    runs-on: [self-hosted, gse-mac]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # ⚠️ **toolchain は `rust-toolchain.toml` (repo 直下) が決める** (R-2)。
      #   ★ 説明の正典は `check` job の同名 step にある。⚠️ ここに複製しない。
      #   ★ 本 job で実際に cargo を起動する主経路は `npx tauri build` (cwd = repo 直下) だが、
      #   rustup は cwd から親へ辿るので**同じファイルが効く**。
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable ブランチ 2026-09-03
      # ★ 固定版を明示的に入れる (⚠️ 理由は `check` job の同名 step のコメント参照)。
      - name: Install pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          # ⚠️ `--no-self-update`: この step は既定で rustup 自身を self-update する (実測)。
          #   ★ self-hosted 実機のツールを黙って書き換えないこと (理由は `check` job の同名 step 参照)。
          # ★ target は指定しない —— 本 job は `--target` を渡さず host 向けに素で作るため。
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version
      # ⚠️★★★ 2026-08-31 追加 (code-reviewer 指摘 #1): 初版のディスクガードは `check` に
      #   しか掛かっておらず、**本ジョブは無防備だった**。★ 本ジョブは同じ `gse-mac` 実機で
      #   release ＋ dmg を 40 分掛けて作るので `check` よりディスクを食い、
      #   落ちたときの損害が最大 (配布物が 1 つも作れない = リリースが止まる)。
      # ⚠️★★ **閾値は `check` と同じ (threshold=15 / floor=8) のままである** ——
      #   ★ code-reviewer 指摘 (2026-08-31): 本ジョブは `check` よりディスクを食うと
      #   論じておきながら、action が用意した `threshold_gb` / `floor_gb` を上書きしていない。
      #   ⚠️ 空き 9GiB で通過し、30 分後に dmg 生成で `os error 28` に落ちる余地が残る。
      #   → ★ **推測で数字を置かない**。release ＋ dmg が実際に何 GiB 使うかを
      #   `du -sh src-tauri/target` で**実測してから** `with:` を足す。それまでは同値。
      #   (follow-up: `.steering/20260831-ci-guard-review-fixes/tasklist.md`)
      - name: Disk guard (self-hosted)
        id: disk_guard
        uses: ./.github/actions/disk-guard
      # ⚠️ floor 発火時はキャッシュ復元を飛ばす (指摘 #2。理由は `check` 側の注記と同じ)。
      # ★ 2026-09-02: **self-hosted では rust-cache を回さない** (詳細は `check` 側の注記)。
      #
      # ⚠️★★★ **本ジョブの rust-cache は元から実質 no-op である** (code-reviewer 指摘, 2026-09-02)。
      #   ⚠️ 初版のこのコメントは「復元が 2m13s〜8m58s かかって失敗する」と書いていたが、
      #   ★ **それは `check` ジョブの実測値であり、本ジョブのものではなかった**。
      #   ★ v0.1.30 のリリース run (33293939800) で本ジョブを実測すると:
      #     - `Run Swatinem/rust-cache@v2`      **1 秒**
      #     - `Post Run Swatinem/rust-cache@v2` **0 秒**
      #   ⚠️ 理由: rust-cache の鍵には **job id が入る** (`add-job-id-key: true` が既定)。
      #     ★ 鍵に job 名が入る証拠として実測できたのは **`check` ジョブのもの**である
      #       (`v0-rust-x86_64-pc-windows-msvc-`**`check`**`-Windows_NT-x64-...`)。
      #     ⚠️ **これは本ジョブの鍵ではない** (Codex/code-reviewer 指摘, 2026-09-02)。
      #       ★ 本ジョブの鍵は `...-`**`build-macos`**`-Darwin-arm64-...` に相当するが、
      #       **一度も保存されていないので実測できない** —— それ自体が下記の根拠である。
      #     ★ 本ジョブの `if:` は `startsWith(github.ref, 'refs/tags/v')` **のみ**＝タグでしか走らず、
      #     下の `save-if` はタグで false になる → ⚠️ **本ジョブの鍵は一度も保存されたことがない**
      #     → 毎回 1 秒で空振りしていた。
      #   → ★ **条件を足しても挙動は変わらない。** 3 か所で同じ規則にし、将来 hosted へ
      #     戻したとき自動で復帰させるために残す。
      # ⚠️★★ **本ジョブの実害は rust 側ではなく npm 側にある** (下の `setup-node` の注記を見ること)。
      # ★ `build-windows` には掛けない —— ⚠️ 「hosted だから利得がある」とは**書かない**
      #   (★ 同 run で `build-windows` の rust-cache も **3 秒**＝何も復元していない)。
      #   ★ 掛けない理由は **hosted は失敗コストが小さく、変更する根拠が無いから**である。
      # ⚠️ `${{ }}` を bash へ直接展開せず `env:` 経由で渡す (security-checker 指摘, 2026-09-02)。
      #   ★ `runner.environment` は PR の内容から操作できない (`env:` / `with:` で `runner.*`
      #   コンテキストを上書きすることはできない) ので**脆弱性ではない**が、
      #   `.github/actions/disk-guard/action.yml` が既に `env:` マッピングに統一しており、
      #   ⚠️ **同じ repo で防御の書き方を非対称にしない**。
      # ★ `runner.name` は出さない —— ⚠️ GitHub 自身が全 self-hosted job のログ 2 行目で
      #   `Runner name: '...'` を無条件に出しており、REST API も `runner_name` を返す。
      #   ★ 重複して出す利得が無い。
      - name: Cache decision (runner.environment を証拠として残す)
        shell: bash
        env:
          RUNNER_ENV: ${{ runner.environment }}
          DISK_GUARD_WIPED: ${{ steps.disk_guard.outputs.wiped }}
        run: |
          echo "runner.environment      = ${RUNNER_ENV}"
          echo "disk_guard.outputs.wiped = ${DISK_GUARD_WIPED:-(null: guard は skip された)}"
          echo "→ rust-cache が走るのは wiped != 'true' かつ runner.environment == 'github-hosted' のときだけ"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ steps.disk_guard.outputs.wiped != 'true' && runner.environment == 'github-hosted' }}
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          # ★ タグ (リリース) ビルドではキャッシュを**保存しない**。
          # v0.1.22 で実害が出た: 成果物 (dmg / tools) は全部できていて ##[error] も 0 件なのに、
          # post ステップの `Failed to save: Unable to reserve cache with key ...` だけで
          # job が failure になり、release ジョブの macOS ダウンロード段
          # (`needs.build-macos.result == 'success'`) が弾かれて **dmg がリリースから落ちた**。
          # ⚠️ ここで release 側のゲートを緩めると「本当にビルドが壊れたとき」に
          #    部分的なリリースを黙って公開してしまうので、緩めるのは**保存側**にする。
          # 復元は従来どおり行うのでビルド時間は変わらない。
          # ⚠️★★★ **旧文はここに「キャッシュの更新は頻繁に走る check ジョブ (main / PR) が担う」
          #   と書いていたが、実測で誤りだった** (code-reviewer 指摘, 2026-09-02)。
          #   ★ rust-cache の鍵には **job id が入る** (`add-job-id-key: true` が既定) ので、
          #   `check` が書いた `...-check-...` の鍵は **`build-*` から一度も参照されない**。
          #   ⚠️ v0.1.30 の実測で本 action は build-macos 1 秒 / build-windows 3 秒＝
          #   **何も復元していない**。→ ★ 「check が更新を担う」という分業は成立していない。
          save-if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      # ⚠️★★★ 2026-09-02: **npm キャッシュも self-hosted では回さない**。
      #   ★ rust-cache と同じ理由だが、⚠️ **こちらの方が実害が大きい**ことを実測で確認した。
      #   v0.1.30 のリリース run (33293939800) の本ジョブ 17m54s の内訳:
      #     - `Build Tauri app`               **6m15s**
      #     - `Post Run actions/setup-node@v4` **10m39s**  ← ⚠️ **最大のステップが npm キャッシュ保存**
      #   ★ つまりリリースビルドの所要時間の半分以上を、1097MB の npm キャッシュ転送が占めていた。
      #   ⚠️ 09-02 に実測した転送速度 (0.0〜0.6 MB/s) では 1097MB は 30 分〜数時間かかる。
      #   → ★ **その速度が再現すれば `timeout-minutes: 40` を超え、dmg が 1 つも作れず
      #     リリースが止まる**。⚠️ 「確実に超える」とは書かない —— 09-02 の速度低下は
      #     「2 台が同一回線で同時送信した時間帯と一致」であり条件依存だからである。
      #   ⚠️ `npm ci` に必要なものは self-hosted 実機の `~/.npm` に永続する
      #   (★ 実測 **3.7GB**・08-25 以降に更新されたファイル 148 個)。
      #   → ★ rust-cache と同じく**利得が重複しており、失敗時のコストだけが残る**。
      # ★ `cache:` は step の `if:` では切れない (入力値なので) → 空文字を渡して無効化する。
      #   ⚠️ `actions/setup-node` は `cache` が falsy なら**キャッシュ処理そのものを行わない**。
      # ★ `frontend-check` (ubuntu-latest) と `build-windows` (windows-latest) は**触らない**。
      #   ⚠️ ただし理由は 2 つで**立証水準が違う**ので分けて書く:
      #   - `frontend-check`: ★ **効いている**。run ログで `Cache restored successfully` /
      #     `Cache restored from key: node-cache-Linux-x64-npm-...` を実測した (32MB・毎 PR で走る)。
      #   - `build-windows`: ⚠️ **効いているとは言えない** (v0.1.30 の post は 0m06s)。
      #     ★ 触らない理由は「hosted は失敗コストが小さく、変更する根拠が無い」である。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - run: npm ci
      # リリースゲート: アプリ内提出 (案A sidecar) は同梱 pubkey.txt を recipient に使う。
      # プレースホルダ (age1 行なし) のままリリースすると参加者全員が提出不能になるため、
      # 実鍵が挿入されていることを機械的に検証する (dev/test ビルドは本ステップを通らない)。
      - name: Verify researcher public key present (release gate)
        shell: bash
        run: |
          if ! grep -qE '^[[:space:]]*age1[0-9a-z]+' src-tauri/resources/pubkey.txt; then
            echo "::error::src-tauri/resources/pubkey.txt に 'age1...' 公開鍵行がありません。リリース前に研究者の実鍵を挿入してください (プレースホルダのままでは参加者が提出不能)。"
            exit 1
          fi
          echo "pubkey.txt OK (age1 line present)"
      - name: Build Tauri app
        # `--features package` is required on macOS: the .app bundler copies *every*
        # `[[bin]]` of the crate into Contents/MacOS/, including `gse-package` / `gse-unpack`
        # which are gated behind `required-features = ["package"]`. Without the flag those
        # binaries are never built and bundling fails ("Failed to copy binary ... does not
        # exist").
        #
        # ★★ ISOLATION CLAIM — MEASURED 2026-08-08 (do not re-litigate from theory).
        # A reviewer flagged this as broken reasoning: cargo unifies features per crate, so
        # the *library* IS compiled with `package` here, therefore (they argued) the blind
        # app links `age` + `reqwest` + rustls. The mechanism is right; the conclusion is not.
        # Unused rlib objects are dropped at link time. Measured on the actual release binary
        # (`cargo build --release --features package --bin gse-next`, same profile as here):
        #   strings gse-next  | grep -c rustls              -> 0
        #   strings gse-next  | grep -c aws_lc_rs           -> 0
        #   strings gse-next  | grep -c reqwest             -> 0
        #   strings gse-next  | grep -c age-encryption.org  -> 0
        # Positive control (same technique on a binary that DOES link them):
        #   strings gse-submit | grep -c rustls             -> 78
        #   strings gse-submit | grep -c age-encryption.org -> 4
        # And `strings gse-next | grep -c gse_next_lib -> 6`, so the tool does read this
        # binary (the zeros are not an empty measurement).
        # => The `age`/HTTP isolation (Cargo.toml, decisions D3 / D-7) HOLDS for the shipped
        #    macOS app. If this build command or the profile changes, RE-MEASURE — do not
        #    assume either way.
        run: npx tauri build --bundles dmg --features package
        env:
          APPLE_SIGNING_IDENTITY: "-"  # Ad-hoc signing (no Apple Developer certificate)
      - name: Re-sign app bundle with entitlements (layered, no --deep)
        run: |
          APP=$(find src-tauri/target/release/bundle -name "*.app" -type d | head -1)
          if [ -n "$APP" ]; then
            BINARY="$APP/Contents/MacOS/gse-next"
            ENTITLEMENTS="src-tauri/Entitlements.plist"

            # 研究者専用 CLI (gse-package=手動提出 / gse-unpack=復号) を .app から除去する。
            # macOS バンドラは --features package ビルドの全 [[bin]] を Contents/MacOS へ自動コピー
            # するが、被験者配布物にこれらは不要 (アプリ内提出は gse-submit のみ使用)。鍵が無ければ
            # gse-unpack は無力で機密漏れではないが、配布物を最小化する (再署名前に削除し署名整合を保つ)。
            # Release のツール資産は target/release/ 由来 (別経路) なので研究者は引き続き取得できる。
            echo "=== Stripping researcher-only CLIs from .app ==="
            rm -f "$APP/Contents/MacOS/gse-package" "$APP/Contents/MacOS/gse-unpack"
            ls "$APP/Contents/MacOS/"

            # レイヤード署名: --deep は Apple 非推奨。
            # ネスト署名の不整合が TCC の権限拒否を引き起こす可能性があるため、
            # 内部バイナリ → 外部バンドルの順に個別署名する。
            # --options runtime は ad-hoc 署名では使用しない（TCC 過剰検証の原因）。

            # アプリ内提出 (案A) のサイドカー = 同梱 gse-submit を含むヘルパ CLI を個別署名する。
            # ヘルパは app の TCC 権限を必要としないため entitlements なしの素の ad-hoc 署名にし、
            # 署名済みバンドルにネスト未署名バイナリが残らないようにする (署名整合・AMFI 対策)。
            echo "=== Signing bundled helper binaries (sidecar) ==="
            for HELPER in gse-submit gse-package gse-unpack; do
              if [ -f "$APP/Contents/MacOS/$HELPER" ]; then
                codesign --force --sign - "$APP/Contents/MacOS/$HELPER"
                echo "signed $HELPER"
              fi
            done

            echo "=== Signing inner binary ==="
            codesign --force --sign - --entitlements "$ENTITLEMENTS" "$BINARY"

            echo "=== Signing app bundle ==="
            codesign --force --sign - --entitlements "$ENTITLEMENTS" "$APP"

            # アプリ内提出の前提物がバンドルに含まれることを保証する (欠落でリリースを止める)。
            echo "=== Asserting in-app submit prerequisites in bundle ==="
            test -f "$APP/Contents/MacOS/gse-submit" || { echo "::error::gse-submit が .app に同梱されていません (アプリ内提出が動作しない)"; exit 1; }
            ls "$APP/Contents/Resources/"*pubkey.txt "$APP/Contents/Resources/resources/pubkey.txt" 2>/dev/null | head -1 | grep -q pubkey.txt \
              || { echo "::error::pubkey.txt が .app の Resources に同梱されていません (recipient 未解決で提出不能)"; exit 1; }
            if [ -e "$APP/Contents/MacOS/gse-package" ] || [ -e "$APP/Contents/MacOS/gse-unpack" ]; then
              echo "::error::researcher 専用 CLI (gse-package/gse-unpack) が .app に残存 (strip 失敗)"; exit 1
            fi

            echo "=== Verification ==="
            codesign --verify --strict "$APP" && echo "Signature OK" || echo "Signature verification failed"

            echo "=== CDHash (for TCC debugging) ==="
            codesign -dvvv "$APP" 2>&1 | grep -E "CDHash|Identifier|TeamIdentifier" || true

            echo "=== Embedded entitlements ==="
            codesign -d --entitlements - "$APP" 2>&1 || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
      # 提出/復号ツール（macOS は --features package 付き tauri build で既にビルド済み）。
      - name: Upload macOS tools
        uses: actions/upload-artifact@v4
        with:
          name: macos-tools
          # ★ macOS は **dmg だけで完結する** (.app に gse-submit と pubkey.txt が同梱され、
          #   アプリ内提出が正規ルート)。Phase1 の実運用でも mac は dmg のみで完了した。
          #   → 単体 gse-submit / gse-package は配らない (mac の 提出する_mac.command 経路は廃止)。
          #   gse-unpack は**研究者専用の復号器**で .app から意図的に strip されているため残す。
          path: |
            src-tauri/target/release/gse-unpack
          if-no-files-found: error
          retention-days: 7

  # ── GitHub Release 作成（片方成功でも実行）──────────────────
  release:
    needs: [build-windows, build-macos]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      always() &&
      (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows portable artifacts
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/
        continue-on-error: true

      - name: Download macOS artifacts
        if: ${{ needs.build-macos.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/

      - name: Download Windows tools
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-tools
          path: artifacts/
        continue-on-error: true

      - name: Download macOS tools
        if: ${{ needs.build-macos.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: macos-tools
          path: artifacts/
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
