name: CI / Release

on:
  push:
    branches: [main, "feature/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always

jobs:
  # ── ブランチ push / PR: 高速チェック ─────────────────────────
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo check
        working-directory: src-tauri

  # ── タグ push: Windows ビルド ────────────────────────────────
  build-windows:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Tauri app
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload portable exe (SAC bypass)
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: src-tauri/target/release/gse-next.exe
          if-no-files-found: warn
          retention-days: 7

  # ── タグ push: macOS ビルド ──────────────────────────────────
  build-macos:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Tauri app
        run: npx tauri build --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: "-"  # Ad-hoc signing (no Apple Developer certificate)
      - name: Re-sign app bundle with entitlements
        run: |
          APP=$(find src-tauri/target/release/bundle -name "*.app" -type d | head -1)
          if [ -n "$APP" ]; then
            echo "Re-signing with entitlements: $APP"
            # Ad-hoc signing: --options runtime は使用しない。
            # Hardened Runtime は Developer ID 署名を前提としており、
            # ad-hoc 署名との組み合わせで TCC (Input Monitoring) の
            # 権限チェックが過度に厳格になる問題が確認されている。
            codesign --force --deep --sign - --entitlements src-tauri/Entitlements.plist "$APP"
            echo "Verifying signature..."
            codesign --verify --deep --strict "$APP" && echo "Signature OK" || echo "Signature verification failed"
            echo "Embedded entitlements:"
            codesign -d --entitlements - "$APP" 2>&1 || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  # ── GitHub Release 作成（片方成功でも実行）──────────────────
  release:
    needs: [build-windows, build-macos]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      always() &&
      (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows NSIS artifacts
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/

      - name: Download Windows portable artifacts
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/
        continue-on-error: true

      - name: Download macOS artifacts
        if: ${{ needs.build-macos.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
