<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <rect width="1400" height="640" fill="#ffffff"/>
  <text x="65" y="62" font-family="Yu Gothic, Meiryo, sans-serif" font-size="34" font-weight="700" fill="#1f2933">段の並びは「何をどの根拠で推定できるか」で決める</text>
  <text x="65" y="101" font-family="Yu Gothic, Meiryo, sans-serif" font-size="21" fill="#52606d">モデルの複雑さの梯子ではない。1 段ずつしか上げず、通らなければ前の段を正のまま残す</text>
  <defs><marker id="arrow5" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker></defs>

  <g font-family="Yu Gothic, Meiryo, sans-serif">
    <rect x="60" y="150" width="300" height="170" rx="10" fill="#e6fffa" stroke="#0f766e" stroke-width="5"/>
    <text x="80" y="190" font-size="25" font-weight="700" fill="#134e4a">固定ベースライン</text>
    <text x="80" y="226" font-size="19" fill="#134e4a">観測と時間的な代理量を確立</text>
    <text x="80" y="254" font-size="19" fill="#134e4a">規則 ＋ 執筆ヘッドの HMM</text>
    <text x="80" y="296" font-size="21" font-weight="700" fill="#0f766e">現在地。既定であり正</text>

    <rect x="400" y="150" width="300" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <text x="420" y="190" font-size="25" font-weight="700" fill="#1e3a8a">criterion 直結</text>
    <text x="420" y="226" font-size="19" fill="#1e3a8a">状態名ではなく、自力で前へ</text>
    <text x="420" y="252" font-size="19" fill="#1e3a8a">進めた帰結そのものを予測</text>
    <text x="420" y="296" font-size="21" font-weight="700" fill="#2563eb">データ未達</text>

    <rect x="740" y="150" width="300" height="170" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
    <text x="760" y="190" font-size="25" font-weight="700" fill="#334155">個人・タスク適応</text>
    <text x="760" y="226" font-size="19" fill="#475569">個人差とタスク差を吸収</text>
    <text x="760" y="252" font-size="19" fill="#475569">階層モデルで縮約する</text>
    <text x="760" y="296" font-size="21" font-weight="700" fill="#475569">正の証拠がある軸</text>

    <rect x="1080" y="150" width="260" height="170" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
    <text x="1100" y="190" font-size="25" font-weight="700" fill="#334155">時系列</text>
    <text x="1100" y="226" font-size="19" fill="#475569">競合する事象と系列構造</text>
    <text x="1100" y="252" font-size="19" fill="#475569">乱数畳み込み ＋ 線形</text>
    <text x="1100" y="296" font-size="21" font-weight="700" fill="#475569">最終段。いま着手しない</text>
  </g>

  <g stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow5)">
    <path d="M360 235 H400"/><path d="M700 235 H740"/><path d="M1040 235 H1080"/>
  </g>

  <g font-family="Yu Gothic, Meiryo, sans-serif">
    <rect x="60" y="370" width="640" height="200" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/>
    <text x="85" y="412" font-size="26" font-weight="700" fill="#7c2d12">段を上げてよい条件</text>
    <text x="85" y="452" font-size="21" fill="#7c2d12">1. およそ 50 セッションぶんのデータがある</text>
    <text x="85" y="486" font-size="21" fill="#7c2d12">2. 人もセッションも分けた検証で、確率の当たり方が良い</text>
    <text x="85" y="520" font-size="21" fill="#7c2d12">3. 推定の上下の幅が、介入するかどうかの判断を反転させない</text>
    <text x="85" y="554" font-size="20" font-weight="700" fill="#b91c1c">「前の段より何ポイント良い」という判定は使わない</text>

    <rect x="740" y="370" width="600" height="200" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="4"/>
    <text x="765" y="410" font-size="26" font-weight="700" fill="#881337">昇格の手前に置いた反証の関門</text>
    <text x="765" y="447" font-size="20" fill="#881337">1. 統制課題で高摩擦と低摩擦が分かれるか</text>
    <text x="765" y="475" font-size="20" fill="#881337">2. 目的変数がそもそも成り立つか</text>
    <text x="765" y="503" font-size="20" fill="#881337">3. 勝ち幅が出て、状態が退化していないか</text>
    <text x="765" y="531" font-size="20" fill="#881337">4. 再生で同じ判断を再現できるか</text>
    <text x="765" y="559" font-size="20" font-weight="700" fill="#b91c1c">1 番目はまだ一度も走っていない</text>
  </g>

  <text x="700" y="612" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#334155">標本は窓の本数ではなく、判断のひとまとまりで数える。30 秒窓を毎秒出すと隣どうしが重なるため</text>
</svg>
