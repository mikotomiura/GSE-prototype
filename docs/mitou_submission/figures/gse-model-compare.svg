<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <rect width="1400" height="640" fill="#ffffff"/>
  <text x="65" y="62" font-family="Yu Gothic, Meiryo, sans-serif" font-size="34" font-weight="700" fill="#1f2933">候補モデルは、どれも「線形と低次元」で揃えてある</text>
  <text x="65" y="101" font-family="Yu Gothic, Meiryo, sans-serif" font-size="21" fill="#52606d">軽さは制約ではなく帰結である。観測が小さくラベルが疎なので、これ以上は正当化できない</text>

  <g font-family="Yu Gothic, Meiryo, sans-serif">
    <rect x="55" y="145" width="415" height="330" rx="10" fill="#e6fffa" stroke="#0f766e" stroke-width="5"/>
    <text x="80" y="188" font-size="26" font-weight="700" fill="#134e4a">いま動いているもの</text>
    <text x="80" y="224" font-size="22" font-weight="700" fill="#134e4a">隠れマルコフモデル</text>
    <text x="80" y="262" font-size="20" fill="#134e4a">入力：整数ひとつ（26 通り）</text>
    <text x="80" y="294" font-size="20" fill="#134e4a">出力：3 状態の確率</text>
    <text x="80" y="326" font-size="20" fill="#134e4a">係数：放出 78 ＋ 遷移 9 ＝ 87</text>
    <text x="80" y="358" font-size="20" fill="#134e4a">更新：毎秒 1 回の前向き計算</text>
    <text x="80" y="400" font-size="20" font-weight="700" fill="#b91c1c">学習は一箇所も無い</text>
    <text x="80" y="432" font-size="20" fill="#134e4a">係数はすべて手で置いた定数</text>
    <text x="80" y="462" font-size="19" fill="#52606d">＝ HMM の形をした規則である</text>

    <rect x="495" y="145" width="415" height="330" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
    <text x="520" y="188" font-size="26" font-weight="700" fill="#1e3a8a">次の段の候補</text>
    <text x="520" y="224" font-size="22" font-weight="700" fill="#1e3a8a">離散時間の競合リスク</text>
    <text x="520" y="262" font-size="20" fill="#1e3a8a">入力：連続値のまま受ける</text>
    <text x="520" y="294" font-size="20" fill="#1e3a8a">出力：期ごとの 3 通りの危険率</text>
    <text x="520" y="326" font-size="20" fill="#1e3a8a">中身：多項ロジスティック</text>
    <text x="520" y="358" font-size="20" fill="#1e3a8a">更新：係数の数に比例するだけ</text>
    <text x="520" y="400" font-size="20" font-weight="700" fill="#1d4ed8">量子化を通らない</text>
    <text x="520" y="432" font-size="20" fill="#1e3a8a">見たい時間幅は読み出し時に与える</text>
    <text x="520" y="462" font-size="19" fill="#52606d">＝ 推定器そのものは時間幅に依らない</text>

    <rect x="935" y="145" width="410" height="330" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="5"/>
    <text x="960" y="188" font-size="26" font-weight="700" fill="#334155">最終段の第一候補</text>
    <text x="960" y="224" font-size="22" font-weight="700" fill="#334155">乱数畳み込み ＋ 線形</text>
    <text x="960" y="262" font-size="20" fill="#475569">入力：時系列そのもの</text>
    <text x="960" y="294" font-size="20" fill="#475569">出力：分類または回帰</text>
    <text x="960" y="326" font-size="20" fill="#475569">中身：畳み込みは学習しない</text>
    <text x="960" y="358" font-size="20" fill="#475569">分類器だけを線形で学習する</text>
    <text x="960" y="400" font-size="20" font-weight="700" fill="#334155">分類器が線形のまま</text>
    <text x="960" y="432" font-size="20" fill="#475569">＝ 手前の段と同じ枠組みで比べられる</text>
    <text x="960" y="462" font-size="19" fill="#52606d">深層の系列モデルは主役から降ろした</text>
  </g>

  <g font-family="Yu Gothic, Meiryo, sans-serif">
    <rect x="55" y="510" width="1290" height="86" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="4"/>
    <text x="80" y="548" font-size="23" font-weight="700" fill="#881337">降ろした理由は好みではなく、同じ土俵での実測である</text>
    <text x="80" y="580" font-size="20" fill="#881337">時系列分類の大規模比較で、深層は上位 2 手法に入っていない [79]。畳み込みの利得は、カーネルを学習しなくても取れる [80]</text>
  </g>

  <text x="700" y="628" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="19" fill="#52606d">これは文献の上での整合であって、本システムのデータでの実証ではない</text>
</svg>
