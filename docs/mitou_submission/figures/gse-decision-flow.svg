<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <rect width="1400" height="700" fill="#ffffff"/>
  <text x="65" y="62" font-family="Yu Gothic, Meiryo, sans-serif" font-size="34" font-weight="700" fill="#1f2933">必要性と好機を分けて判断する</text>
  <text x="65" y="101" font-family="Yu Gothic, Meiryo, sans-serif" font-size="21" fill="#52606d">両方が立ったときだけ出す。片方だけなら見送る。上から順に、ひとつでも外れたらそこで止まる</text>
  <defs><marker id="arrow4" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker></defs>

  <g font-family="Yu Gothic, Meiryo, sans-serif" text-anchor="middle">
    <rect x="60" y="145" width="620" height="72" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
    <text x="370" y="191" font-size="27" font-weight="700" fill="#334155">3 分間ふれていない？</text>

    <rect x="60" y="253" width="620" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <text x="370" y="299" font-size="27" font-weight="700" fill="#1e3a8a">停滞の確率が 0.60 以上？</text>

    <rect x="60" y="361" width="620" height="72" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/>
    <text x="370" y="407" font-size="27" font-weight="700" fill="#7c2d12">好機が 0.35 以上？</text>

    <rect x="60" y="469" width="620" height="72" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="4"/>
    <text x="370" y="515" font-size="27" font-weight="700" fill="#881337">抑制にかからない？</text>

    <rect x="150" y="577" width="440" height="80" rx="10" fill="#e6fffa" stroke="#0f766e" stroke-width="5"/>
    <text x="370" y="629" font-size="30" font-weight="700" fill="#134e4a">そっと表示する</text>
  </g>

  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow4)">
    <path d="M370 217 V253"/><path d="M370 325 V361"/><path d="M370 433 V469"/><path d="M370 541 V577"/>
  </g>

  <g font-family="Yu Gothic, Meiryo, sans-serif" font-size="20" fill="#475569">
    <text x="700" y="188">はい なら 何もしない</text>
    <text x="700" y="296">いいえ なら 何もしない</text>
    <text x="700" y="404">いいえ なら 見送る</text>
    <text x="700" y="512">かかる なら 見送る</text>
  </g>

  <g font-family="Yu Gothic, Meiryo, sans-serif">
    <rect x="960" y="145" width="380" height="180" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/>
    <text x="982" y="185" font-size="23" font-weight="700" fill="#7c2d12">好機の中身（主なもの）</text>
    <text x="982" y="222" font-size="19" fill="#7c2d12">2〜8 秒の小休止　＋0.45</text>
    <text x="982" y="252" font-size="19" fill="#7c2d12">8〜30 秒の間　　　＋0.35</text>
    <text x="982" y="282" font-size="19" fill="#7c2d12">打鍵している最中　−0.20</text>
    <text x="982" y="312" font-size="19" fill="#7c2d12">是正しながら打つ間 −0.20</text>

    <rect x="960" y="349" width="380" height="180" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="4"/>
    <text x="982" y="389" font-size="23" font-weight="700" fill="#881337">抑制の中身</text>
    <text x="982" y="426" font-size="19" fill="#881337">直前の提示から 10 分</text>
    <text x="982" y="456" font-size="19" fill="#881337">1 日あたり 6 回まで</text>
    <text x="982" y="486" font-size="19" fill="#881337">閉じられた直後は 20 分</text>
    <text x="982" y="516" font-size="19" fill="#881337">表示中は自分で消さない</text>
  </g>

  <g font-family="Yu Gothic, Meiryo, sans-serif">
    <rect x="60" y="677" width="1280" height="0" fill="none"/>
  </g>
  <text x="700" y="690" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#334155">「見送る」は失敗ではなく、記録される第一級の判断である。守るべき時に出した割合を最重要の指標に置く</text>
</svg>
