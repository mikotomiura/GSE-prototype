<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660">
  <rect width="1400" height="660" fill="#ffffff"/>
  <text x="65" y="62" font-family="Yu Gothic, Meiryo, sans-serif" font-size="34" font-weight="700" fill="#1f2933">連続な二軸を 26 個の観測ビンに落とす</text>
  <text x="65" y="101" font-family="Yu Gothic, Meiryo, sans-serif" font-size="21" fill="#52606d">HMM が受け取るのはこの整数ひとつだけ。確率は遷移行列と放出行列が決める</text>
  <defs><marker id="arrow2" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker></defs>

  <!-- 5x5 グリッド -->
  <g font-family="Yu Gothic, Meiryo, sans-serif">
    <text x="95" y="152" font-size="23" font-weight="700" fill="#334155">観測ビン obs ＝ X区分 × 5 ＋ Y区分</text>
    <g stroke="#0f766e" stroke-width="3" fill="#e6fffa">
      <rect x="150" y="175" width="66" height="66"/><rect x="216" y="175" width="66" height="66"/><rect x="282" y="175" width="66" height="66"/><rect x="348" y="175" width="66" height="66"/><rect x="414" y="175" width="66" height="66"/>
      <rect x="150" y="241" width="66" height="66"/><rect x="216" y="241" width="66" height="66"/><rect x="282" y="241" width="66" height="66"/><rect x="348" y="241" width="66" height="66"/><rect x="414" y="241" width="66" height="66"/>
      <rect x="150" y="307" width="66" height="66"/><rect x="216" y="307" width="66" height="66"/><rect x="282" y="307" width="66" height="66"/><rect x="348" y="307" width="66" height="66"/><rect x="414" y="307" width="66" height="66"/>
      <rect x="150" y="373" width="66" height="66"/><rect x="216" y="373" width="66" height="66"/><rect x="282" y="373" width="66" height="66"/><rect x="348" y="373" width="66" height="66"/><rect x="414" y="373" width="66" height="66"/>
      <rect x="150" y="439" width="66" height="66"/><rect x="216" y="439" width="66" height="66"/><rect x="282" y="439" width="66" height="66"/><rect x="348" y="439" width="66" height="66"/><rect x="414" y="439" width="66" height="66"/>
    </g>
    <g text-anchor="middle" font-size="22" fill="#134e4a">
      <text x="183" y="216">4</text><text x="249" y="216">9</text><text x="315" y="216">14</text><text x="381" y="216">19</text><text x="447" y="216">24</text>
      <text x="183" y="282">3</text><text x="249" y="282">8</text><text x="315" y="282">13</text><text x="381" y="282">18</text><text x="447" y="282">23</text>
      <text x="183" y="348">2</text><text x="249" y="348">7</text><text x="315" y="348">12</text><text x="381" y="348">17</text><text x="447" y="348">22</text>
      <text x="183" y="414">1</text><text x="249" y="414">6</text><text x="315" y="414">11</text><text x="381" y="414">16</text><text x="447" y="414">21</text>
      <text x="183" y="480">0</text><text x="249" y="480">5</text><text x="315" y="480">10</text><text x="381" y="480">15</text><text x="447" y="480">20</text>
    </g>
    <text x="315" y="540" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">X ＝ 摩擦（大きいほど右）</text>
    <text x="118" y="345" text-anchor="middle" font-size="22" font-weight="700" fill="#334155" transform="rotate(-90 118 345)">Y ＝ 前進（大きいほど上）</text>
    <text x="315" y="575" text-anchor="middle" font-size="19" fill="#52606d">境界は 0.2 刻み。1.0 は最上位の区分に入れる</text>
  </g>

  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow2)"><path d="M500 340 H580"/></g>

  <!-- 遷移行列 -->
  <g font-family="Yu Gothic, Meiryo, sans-serif">
    <text x="600" y="152" font-size="23" font-weight="700" fill="#334155">遷移行列（1 秒あたり・行和は 1）</text>
    <g text-anchor="middle" font-size="20" fill="#1e3a8a">
      <rect x="600" y="175" width="150" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="750" y="175" width="115" height="52" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <rect x="865" y="175" width="115" height="52" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <rect x="980" y="175" width="115" height="52" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="807" y="208" font-weight="700">→ 流れ</text><text x="922" y="208" font-weight="700">→ 潜伏</text><text x="1037" y="208" font-weight="700">→ 停滞</text>

      <rect x="600" y="227" width="150" height="52" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <rect x="750" y="227" width="115" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="865" y="227" width="115" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="980" y="227" width="115" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <text x="675" y="260" font-weight="700">流れ から</text><text x="807" y="260">0.75</text><text x="922" y="260">0.17</text><text x="1037" y="260">0.08</text>

      <rect x="600" y="279" width="150" height="52" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <rect x="750" y="279" width="115" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="865" y="279" width="115" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="980" y="279" width="115" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <text x="675" y="312" font-weight="700">潜伏 から</text><text x="807" y="312">0.12</text><text x="922" y="312">0.80</text><text x="1037" y="312">0.08</text>

      <rect x="600" y="331" width="150" height="52" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <rect x="750" y="331" width="115" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="865" y="331" width="115" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="980" y="331" width="115" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <text x="675" y="364" font-weight="700">停滞 から</text><text x="807" y="364">0.06</text><text x="922" y="364">0.18</text><text x="1037" y="364">0.76</text>
    </g>
    <text x="600" y="410" font-size="19" fill="#52606d">対角が大きい ＝ 状態は続きやすい。流れから抜けるまでの</text>
    <text x="600" y="436" font-size="19" fill="#52606d">目安は 1 ÷ (1 − 0.75) ＝ 4 秒</text>
  </g>

  <!-- ペナルティビン -->
  <g font-family="Yu Gothic, Meiryo, sans-serif">
    <rect x="600" y="466" width="740" height="118" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="4"/>
    <text x="625" y="504" font-size="24" font-weight="700" fill="#881337">26 個目のビン ＝ 連続した打ち消し</text>
    <text x="625" y="537" font-size="19" fill="#881337">是正キーが 14 回続いたら、二軸を通さず obs を 25 にする</text>
    <text x="625" y="566" font-size="19" fill="#881337">このビンだけ、停滞の放出確率が流れの 99 倍ある</text>
  </g>

  <text x="1160" y="613" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="19" fill="#52606d">厳密な定義は『技術設計書』4.2</text>
</svg>
